<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>입지마요 UI 수정용 - 연결형 진단 문구 최종</title>
  <meta name="theme-color" content="#8FD14F" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    :root {
      --accent: #8FD14F;
      --accent-2: #9BE86C;
      --accent-soft: #DDF8CC;
      --accent-pale: #EEFBE7;
      --bg: #F5F6F8;
      --card: #FFFFFF;
      --text: #101722;
      --muted: #6B7280;
      --muted-2: #9AA3AF;
      --line: #E6EAF0;
      --blue: #0A84FF;
      --yellow: #FFD60A;
      --orange: #FF9F0A;
      --red: #FF453A;
      --dark: #2C3440;
      --shadow: 0 18px 60px rgba(16, 23, 34, .09);
      --soft-shadow: 0 12px 36px rgba(143, 209, 79, .22);
      --radius-xl: 34px;
      --radius-lg: 26px;
      --phone-w: 430px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at 50% 0%, #fff 0%, var(--bg) 72%); }
    /* 화면 전환 시 스크롤바가 깜빡이며 보이는 것을 막기 위해, 스크롤은 그대로 두고 막대만 숨깁니다. */
    html { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Segoe UI, sans-serif;
      color: var(--text);
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }

    .phone {
      position: relative;
      width: min(var(--phone-w), 100vw);
      min-height: 100dvh;
      background: linear-gradient(180deg, #fff 0%, #fff 78%, #FAFBFC 100%);
      overflow: hidden;
      isolation: isolate;
    }

    @media (min-width: 520px) {
      body { padding: 24px; }
      .phone { min-height: 880px; max-height: 920px; border-radius: 42px; box-shadow: 0 30px 90px rgba(16, 23, 34, .18); border: 1px solid rgba(255,255,255,.9); display: flex; flex-direction: column; }
      #app { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
      #app::-webkit-scrollbar { display: none; width: 0; height: 0; }
    }

    .screen {
      position: relative;
      min-height: 100dvh;
      padding: 24px 24px calc(82px + env(safe-area-inset-bottom));
      animation: screenIn .28s ease both;
    }
    @media (min-width: 520px) { .screen { min-height: 880px; } }
    @keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .topbar {
      height: 76px;
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 30;
    }
    .icon-btn {
      width: 46px; height: 46px;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      display: grid; place-items: center;
      transition: .18s ease;
    }
    .icon-btn svg { width: 29px; height: 29px; stroke-width: 2.7; }
    .icon-btn.circle { background: #fff; border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(16, 23, 34, .06); }
    .icon-btn:active { transform: scale(.96); }
    .icon-btn.disabled { opacity: .28; pointer-events: none; }

    .mode-toggle {
      width: 236px;
      margin: 0 auto;
      height: 56px;
      border-radius: 999px;
      padding: 6px;
      background: #ECEFF5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(210,216,225,.7);
    }
    .mode-pill {
      position: absolute;
      width: calc(50% - 6px);
      height: 44px;
      top: 6px; left: 6px;
      background: var(--accent-2);
      border-radius: 999px;
      transition: transform .32s cubic-bezier(.2,.8,.2,1);
      box-shadow: 0 8px 20px rgba(143, 209, 79, .30);
    }
    .mode-toggle.monitoring .mode-pill { transform: translateX(100%); }
    .mode-tab {
      z-index: 1;
      background: transparent;
      border-radius: 999px;
      color: #5D6675;
      font-weight: 850;
      font-size: 18px;
      letter-spacing: -.03em;
    }
    .mode-tab.active { color: #111827; }

    .center { text-align: center; }
    .eyebrow { color: var(--muted); font-size: 20px; font-weight: 600; letter-spacing: -.04em; margin: 46px 0 10px; }
    .title { font-size: 34px; line-height: 1.18; letter-spacing: -.065em; font-weight: 900; margin: 0; }
    .subtitle { color: var(--muted); font-size: 18px; line-height: 1.55; letter-spacing: -.04em; margin: 16px auto 0; max-width: 340px; }

    .main-circle-wrap { margin: 70px auto 0; width: min(312px, 78vw); aspect-ratio: 1; position: relative; }
    .main-circle-wrap::before {
      content:""; position:absolute; inset:-18px; border-radius:50%; background: rgba(143,209,79,.22);
      filter: blur(.2px); box-shadow: 0 25px 48px rgba(143,209,79,.18);
    }
    .main-circle-wrap.warmup-ring-wrap::before { content: none; box-shadow: none; background: none; }
    .main-circle {
      width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle at 38% 30%, #A7F079 0%, #95E866 45%, #8EDB5E 100%);
      display: grid; place-items: center; position: relative;
      box-shadow: inset 0 -20px 34px rgba(91,160,48,.08), var(--soft-shadow);
      color: #0E161F;
      transition: .2s ease;
    }
    .main-circle:active { transform: scale(.985); }
    .main-circle-content { display: grid; place-items: center; gap: 13px; font-weight: 900; font-size: 25px; letter-spacing: -.05em; }
    .heat-icon { width: 50px; height: 50px; stroke: currentColor; fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .bottom-note { position: absolute; left: 24px; right: 24px; bottom: calc(26px + env(safe-area-inset-bottom)); color: var(--muted); text-align: center; font-size: 16px; letter-spacing: -.04em; }

    .status-card {
      margin: 20px auto 22px;
      width: 100%;
      background: linear-gradient(135deg, #DFF9D3 0%, #CFF5BE 100%);
      border: 1px solid rgba(143,209,79,.42);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 12px 34px rgba(143,209,79,.18);
    }
    .status-row { display: flex; align-items: center; gap: 14px; }
    .status-icon { width: 54px; height: 54px; flex: 0 0 54px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 27px; }
    .status-copy { flex: 1; min-width: 0; }
    .status-copy b { font-size: 20px; letter-spacing: -.05em; display: block; }
    .status-copy span { color: #5B6573; font-size: 16px; letter-spacing: -.04em; }
    .chip-btn { border-radius: 999px; padding: 12px 16px; background: var(--accent-2); color: #0E161F; font-weight: 850; white-space: nowrap; box-shadow: 0 8px 20px rgba(143,209,79,.26); }
    .mini-progress { height: 8px; margin-top: 15px; border-radius: 999px; background: rgba(255,255,255,.72); overflow: hidden; }
    .mini-progress > i { display: block; height: 100%; width: var(--p, 0%); background: var(--accent-2); border-radius: inherit; transition: width .35s ease; }

    .time-timer { width: min(292px, 75vw); aspect-ratio: 1; margin: 58px auto 28px; position: relative; display: grid; place-items: center; }
    .timer-disc {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, #fff 0deg var(--elapsed, 0deg), var(--accent-2) var(--elapsed, 0deg) 360deg);
      border: 2px solid #DDE4EC;
      box-shadow: 0 24px 60px rgba(143,209,79,.18);
    }
    .timer-disc::before { content:""; position:absolute; inset: -26px; border-radius:50%; background: radial-gradient(circle, rgba(143,209,79,.18), rgba(143,209,79,0) 72%); z-index:-1; }
    .timer-dot { position: absolute; width: 24px; height: 24px; border-radius: 50%; background: var(--text); z-index: 3; }
    .tick { position: absolute; width: 3px; height: 18px; border-radius: 999px; background: rgba(62,77,55,.45); top: 10px; left: 50%; transform-origin: 50% calc(min(292px, 75vw) / 2 - 10px); }
    .timer-text { text-align: center; font-weight: 950; font-size: 46px; letter-spacing: -.06em; margin-top: 6px; }
    .text-btn { background: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; font-size: 16px; font-weight: 650; }

    .ready-visual { margin: 96px auto 34px; display: grid; place-items: center; gap: 22px; }
    .check-big { width: 112px; height: 112px; border-radius: 50%; background: var(--accent-2); display: grid; place-items: center; box-shadow: var(--soft-shadow); }
    .check-big.danger { background: var(--red); color: #fff; }
    .check-big svg { width: 64px; height: 64px; stroke-width: 6; }
    .shirt { font-size: 62px; filter: drop-shadow(0 10px 14px rgba(49, 169, 232, .16)); }
    .hint-box { margin: 24px auto 0; max-width: 345px; padding: 16px 18px; border-radius: 24px; background: #F1F4F8; color: var(--muted); font-size: 15px; line-height: 1.5; letter-spacing: -.04em; }

    .analysis-card { margin: 100px auto 0; display: grid; place-items: center; }
    .cloth-stage { width: min(280px, 72vw); height: min(280px, 72vw); border-radius: 34px; background: #DDF8CC; display: grid; place-items: center; position: relative; box-shadow: 0 18px 45px rgba(16, 23, 34, .05); overflow: hidden; }
    .cloth-stage .shirt { font-size: 84px; }
    .magnifier { position:absolute; width:92px; height:92px; animation: scanSquare 3.1s ease-in-out infinite; filter: drop-shadow(0 10px 14px rgba(16,23,34,.20)); }
    .magnifier::before { content:""; position:absolute; width:58px; height:58px; left:5px; top:5px; border:8px solid rgba(16,23,34,.88); border-radius:50%; background:rgba(255,255,255,.05); backdrop-filter: blur(1px); }
    .magnifier::after { content:""; position:absolute; width:15px; height:43px; left:61px; top:56px; border-radius:999px; background:rgba(16,23,34,.88); transform:rotate(-45deg); transform-origin:top center; }
    @keyframes scanSquare { 0% { transform: translate(-72px, -62px); } 25% { transform: translate(66px, -62px); } 50% { transform: translate(66px, 56px); } 75% { transform: translate(-72px, 56px); } 100% { transform: translate(-72px, -62px); } }
    .typing { font-size: 33px; font-weight: 950; letter-spacing: -.06em; margin: 34px 0 22px; }
    .typing .typing-dots::after { content: ''; animation: dots 1.2s steps(4,end) infinite; }
    @keyframes dots { 0% { content:''; } 25% { content:'.'; } 50% { content:'..'; } 75%,100% { content:'...'; } }
    .progress-line { width: min(300px, 76vw); height: 9px; border-radius: 999px; overflow: hidden; background: #ECEFF5; }
    .progress-line i { display: block; height: 100%; width: var(--p, 0%); background: linear-gradient(90deg, var(--accent-2), #C6F7A8); border-radius: inherit; transition: width .28s linear; }

    .result-screen { padding-top: 18px; display: flex; flex-direction: column; min-height: calc(100dvh - 34px); }
    .result-card {
      position: relative;
      margin: 14px auto 0;
      width: 100%;
      border-radius: 34px;
      background: #fff;
      box-shadow: var(--shadow);
      padding: 28px 22px 24px;
      text-align: center;
      border: 1px solid rgba(230,234,240,.8);
    }
    .result-home-btn {
      position: absolute; top: 14px; left: 14px; width: 36px; height: 36px;
      border-radius: 50%; background: #fff; border: 1px solid var(--line);
      display: grid; place-items: center; color: var(--text);
      box-shadow: 0 6px 16px rgba(16,23,34,.08); z-index: 5;
    }
    .result-home-btn svg { width: 18px; height: 18px; stroke-width: 2.6; }
    .result-label { color: var(--muted); letter-spacing: .23em; font-weight: 800; font-size: 13px; margin-bottom: 8px; }
    .result-diagnosis-summary {
      margin: 2px auto 0;
      max-width: 370px;
      padding: 0 18px;
      color: var(--text);
      font-size: clamp(18px, 5vw, 22px);
      line-height: 1.34;
      font-weight: 950;
      letter-spacing: -.055em;
      text-align: center;
      word-break: keep-all;
    }
    .result-diagnosis-summary .diagnosis-line {
      display: block;
    }
    .result-diagnosis-summary .diagnosis-line + .diagnosis-line {
      margin-top: 3px;
    }
    .result-orb { width: min(238px, 62vw); aspect-ratio: 1; border-radius: 50%; margin: 14px auto 20px; background: var(--result-color); display: grid; place-items: center; position: relative; box-shadow: 0 22px 60px color-mix(in srgb, var(--result-color) 35%, transparent); }
    .result-orb::before { content:""; position:absolute; inset: 24%; border-radius:50%; background: rgba(255,255,255,.24); border: 1px solid rgba(255,255,255,.42); }
    .result-orb span { position: relative; z-index: 1; font-size: 58px; color: #fff; font-weight: 950; text-shadow: 0 5px 14px rgba(0,0,0,.12); }
    .result-badge { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 999px; background: color-mix(in srgb, var(--result-color) 92%, #fff 8%); color: #fff; font-weight: 850; box-shadow: 0 8px 18px color-mix(in srgb, var(--result-color) 28%, transparent); }
    .result-title { font-size: 38px; line-height: 1.12; letter-spacing: -.075em; font-weight: 950; margin: 14px 0 8px; }
    .result-subtitle { color: var(--muted); line-height: 1.48; font-size: 17px; letter-spacing: -.04em; margin: 0 auto; max-width: 330px; }
    .result-guidance {
      margin: 18px auto 4px;
      max-width: 350px;
      color: var(--text);
      font-size: clamp(17px, 4.7vw, 20px);
      line-height: 1.48;
      font-weight: 800;
      letter-spacing: -.045em;
      word-break: keep-all;
      text-align: center;
    }
    .result-title.only { margin-top: 20px; margin-bottom: 6px; font-size: clamp(19px, 5.6vw, 23px); letter-spacing: -.03em; white-space: nowrap; }
    .odor-meter { margin: 26px 4px 0; text-align: left; }
    .meter-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 12px; }
    .meter-head b { font-size: 16px; letter-spacing: -.04em; }
    .score { font-size: 31px; color: var(--result-color); font-weight: 950; letter-spacing: -.04em; }
    .score small { font-size: 16px; color: var(--muted); font-weight: 700; }
    .meter-bar { height: 18px; border-radius: 999px; background: linear-gradient(90deg, #F1F3F6 0%, #A9B0BA 50%, #111827 100%); position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,.08); }
    .meter-marker { position: absolute; top: 50%; left: var(--x, 0%); width: 30px; height: 30px; transform: translate(-50%, -50%); border-radius: 50%; background: #fff; border: 6px solid var(--result-color); box-shadow: 0 6px 18px rgba(16,23,34,.16); }
    .meter-labels { display:flex; justify-content:space-between; color: var(--muted); font-size: 13px; margin-top: 10px; }
    .moisture-row { margin-top: 18px; display:flex; gap: 12px; }
    .moisture-card { flex:1; border-radius: 22px; background:#F4F7FA; padding: 16px; text-align:left; }
    .moisture-card b { display:block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .moisture-state { display:flex; align-items:center; gap:8px; font-weight: 900; font-size: 20px; letter-spacing:-.05em; }
    .ox { width: 34px; height: 34px; border-radius: 50%; display:grid; place-items:center; color:#fff; font-weight:950; background: var(--ox-color); }
    .result-foot { margin: 14px auto 0; color: var(--muted); text-align:center; font-size: 14px; line-height:1.5; letter-spacing:-.04em; }
    .moisture-status-card {
      margin: 16px auto 0;
      width: 100%;
      border-radius: 22px;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #FFFFFF 0%, color-mix(in srgb, var(--moisture-color) 10%, #FFFFFF 90%) 100%);
      border: 1px solid color-mix(in srgb, var(--moisture-color) 24%, #FFFFFF 76%);
      box-shadow: 0 10px 24px color-mix(in srgb, var(--moisture-color) 11%, transparent);
      text-align: left;
    }
    .moisture-status-icon {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--moisture-color);
      color: #fff;
      font-size: 27px;
      font-weight: 950;
      letter-spacing: -.06em;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--moisture-color) 28%, transparent);
    }
    .moisture-status-copy { min-width: 0; }
    .moisture-status-copy span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .08em;
      margin-bottom: 3px;
    }
    .moisture-status-copy b {
      display: block;
      color: var(--text);
      font-size: 19px;
      font-weight: 950;
      letter-spacing: -.06em;
      line-height: 1.12;
    }
    .moisture-status-copy p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      letter-spacing: -.04em;
    }

    /* ===== 결과화면 중앙 비주얼 (LED 링 + 상태별 일러스트) ===== */
    .result-visual-wrap { width: min(210px, 56vw); aspect-ratio: 1; margin: 16px auto 4px; position: relative; }
    .led-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 9px solid color-mix(in srgb, var(--result-color) 42%, #fff 58%);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--result-color) 18%, transparent) inset,
        0 0 14px 2px color-mix(in srgb, var(--result-color) 30%, transparent),
        0 10px 26px color-mix(in srgb, var(--result-color) 18%, transparent);
      animation: ledPulse 2.8s ease-in-out infinite;
    }
    @keyframes ledPulse {
      0%, 100% {
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--result-color) 18%, transparent) inset,
          0 0 14px 2px color-mix(in srgb, var(--result-color) 28%, transparent),
          0 10px 24px color-mix(in srgb, var(--result-color) 16%, transparent);
      }
      50% {
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--result-color) 24%, transparent) inset,
          0 0 26px 7px color-mix(in srgb, var(--result-color) 44%, transparent),
          0 12px 32px color-mix(in srgb, var(--result-color) 24%, transparent);
      }
    }
    .result-illustration {
      position: absolute; inset: 13px; border-radius: 50%;
      background: radial-gradient(circle at 40% 26%, #fff 0%, #FAFBFD 100%);
      box-shadow: inset 0 -12px 20px rgba(16,23,34,.05);
      display: grid; place-items: center; overflow: hidden;
    }
    .scene { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
    .scene .shirt { font-size: 78px; position: relative; z-index: 2; filter: drop-shadow(0 8px 12px rgba(16,23,34,.16)); }

    /* 1) 냄새X·수분X — 깨끗함: 크게 그려진 옷 + 근접 반짝임 */
    .scene-clean .shirt { font-size: 96px; }
    .scene-clean .shine-sweep {
      position: absolute; top: -10%; left: -55%; width: 55%; height: 120%;
      background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,.9) 45%, transparent 90%);
      transform: rotate(18deg);
      mix-blend-mode: screen; pointer-events: none; z-index: 3;
      animation: shineSweep 2.8s ease-in-out infinite;
    }
    @keyframes shineSweep { 0% { left: -55%; opacity: 0; } 12% { opacity: 1; } 55% { left: 125%; opacity: 0; } 100% { left: 125%; opacity: 0; } }
    .scene-clean .sparkle { position: absolute; font-size: 22px; animation: twinkle 1.7s ease-in-out infinite; z-index: 3; }
    .scene-clean .sparkle.s1 { top: 22%; right: 20%; animation-delay: .2s; }
    .scene-clean .sparkle.s2 { bottom: 24%; left: 18%; animation-delay: .9s; font-size: 16px; }
    @keyframes twinkle { 0%, 100% { opacity: .1; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1.2) rotate(14deg); } }

    /* 2) 냄새X·수분O — 옷 아랫단(밑부분)에서 방울져 떨어지는 물방울 */
    .scene-drying .shirt { font-size: 88px; }
    .falling-drop { position: absolute; top: 63%; font-size: 19px; opacity: 0; z-index: 4; animation: dripFall 2.4s ease-in infinite; }
    .falling-drop.d1 { left: 40%; animation-delay: 0s; }
    .falling-drop.d2 { left: 50%; animation-delay: .8s; }
    .falling-drop.d3 { left: 60%; animation-delay: 1.6s; }
    @keyframes dripFall { 0% { transform: translateY(0); opacity: 0; } 14% { opacity: 1; } 78% { transform: translateY(40px); opacity: .2; } 100% { transform: translateY(46px); opacity: 0; } }

    /* 3) 냄새△·수분X — 옷 위로 은은한 냄새 구름 1~2개 (뭉게뭉게 3연 구슬 모양) */
    .scene-caution .shirt { font-size: 88px; }
    .odor-cloud {
      --cloud-color: rgba(214, 216, 222, .82);
      position: absolute; width: 30px; height: 16px;
      background: var(--cloud-color);
      border-radius: 50px;
      box-shadow: 0 3px 5px rgba(16,23,34,.06);
      animation: cloudFloat 3.2s ease-in-out infinite;
      z-index: 3;
    }
    .odor-cloud::before, .odor-cloud::after {
      content: ""; position: absolute; background: var(--cloud-color); border-radius: 50%;
    }
    .odor-cloud::before { width: 15px; height: 15px; top: -7px; left: 3px; }

    /* 분석 결과 화면의 LED 링(테두리만 점등, 안쪽은 하양)과 동일한 스타일을 사용합니다.
       수분 정체 감지와 냄새 위험 감지는 분석 결과에서 모두 '주의(노란색)'로 표시되므로
       메인 화면에서도 tone-caution 하나로 통일해 동일한 색으로 보여줍니다. */
    .monitor-clock {
      --ring-color: var(--blue);
      width:min(210px, 56vw); height:min(210px, 56vw); border-radius:50%; position:relative; overflow:hidden; display:grid; place-items:center; margin:0 auto 22px;
      background: radial-gradient(circle at 40% 26%, #fff 0%, #FAFBFD 100%);
      border: 9px solid color-mix(in srgb, var(--ring-color) 42%, #fff 58%);
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--ring-color) 18%, transparent) inset,
        0 0 14px 2px color-mix(in srgb, var(--ring-color) 30%, transparent),
        0 10px 26px color-mix(in srgb, var(--ring-color) 18%, transparent);
      transition: border-color .4s ease, box-shadow .4s ease;
      animation: monitorLedPulse 2.8s ease-in-out infinite;
    }
    .monitor-clock.tone-caution { --ring-color: var(--yellow); }
    @keyframes monitorLedPulse {
      0%, 100% {
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--ring-color) 18%, transparent) inset,
          0 0 14px 2px color-mix(in srgb, var(--ring-color) 28%, transparent),
          0 10px 24px color-mix(in srgb, var(--ring-color) 16%, transparent);
      }
      50% {
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--ring-color) 24%, transparent) inset,
          0 0 26px 7px color-mix(in srgb, var(--ring-color) 44%, transparent),
          0 12px 32px color-mix(in srgb, var(--ring-color) 24%, transparent);
      }
    }
    .monitor-clock .mini-hanger { position:absolute; top:42px; width:81px; height:34px; border-top:4px solid #4B5563; border-radius:50% 50% 0 0; }
    .monitor-clock .mini-hanger::before { content:""; position:absolute; left:50%; top:-18px; width:18px; height:22px; border:4px solid #4B5563; border-bottom:0; border-radius:26px 26px 0 0; transform:translateX(-50%); }

    /* ===== v40: LED 분리 깜빡임 + 순차 LED + 불꽃형 예열 UI ===== */
    @property --sequential-angle {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    /* 꺼진 LED 영역은 흰색으로 고정하고, 실제 색상 진행 영역만 별도 레이어로 표현 */
    .smart-led-ring-base {
      position: absolute;
      inset: -6px;
      z-index: 4;
      border-radius: 50%;
      background: #FFFFFF;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
      opacity: .96;
      filter: drop-shadow(0 0 6px rgba(255,255,255,.82));
    }
    .smart-led-ring { z-index: 5; }

    /* 흰색 LED는 밑에 항상 켜져있는 흰색 베이스 링과 구분이 안 가므로, 흰색 LED일 때만
       베이스 링을 옅은 회색 트랙으로 낮춰서 실제 점등된 호가 도드라지게 합니다. */
    .smart-device.white-led .smart-led-ring-base {
      opacity: .16;
      background: #B9C0CB;
      filter: none;
    }

    /* 2번째 화면: 흰색 미점등 구간은 완전히 고정하고, 주황색으로 채워진 호만 점멸 */
    .smart-device.behavior-pulse .smart-led-ring-base {
      opacity: 1 !important;
      animation: none !important;
      transform: none !important;
      filter: none !important;
      background: #FFFFFF !important;
    }
    .smart-device.behavior-pulse .smart-led-ring.pulse {
      animation: coloredArcOnlyBlink .82s steps(1, end) infinite !important;
      transform: none !important;
      transform-origin: center;
      filter: none !important;
    }
    @keyframes coloredArcOnlyBlink {
      0%, 48%, 100% { opacity: 1; }
      49%, 99% { opacity: 0; }
    }

    /* 4번째 화면: 어두운 흰색 대기 LED 위로 밝은 흰색 LED가 12시부터 순차적으로 차오름 */
    .smart-device.behavior-sequential .smart-led-ring-base,
    .smart-device.behavior-sequential .smart-led-ring.sequential {
      opacity: 0;
      filter: none;
      animation: none;
    }
    .smart-led-sequence {

      background: rgba(173,181,192,.42);
      border: 1px solid rgba(44,52,64,.22);
      opacity: .42;
      transform: translate(-50%,-50%) rotate(calc(var(--i) * 22.5deg)) translateY(-67px);
      transform-origin: center;
      animation: smartSequentialDot .16s ease-out forwards;
      animation-delay: calc(var(--i) * .105s);
    }
    @keyframes smartSequentialDot {
      from {

      to {

    /* ===== v43: 온보딩 전환 중 홈 불꽃 노출 방지 + 더 큰 대칭형 불꽃 ===== */

    /* ===== v47: 냄새 표현·5단계 표시·자동 확인 정보 카드 ===== */

    /* 나쁜 냄새는 검은 구름 대신 올리브색 유기적 냄새 선과 퍼프로 표현 */
    .odor-signs {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }
    .odor-wisp {
      position: absolute;
      width: 24px;
      height: 46px;
      color: #9AAF2D;
      opacity: .72;
      filter: drop-shadow(0 3px 5px rgba(103, 126, 22, .18));
      animation: odorWispRise 2.7s ease-in-out infinite;
    }
    .odor-wisp svg { width: 100%; height: 100%; overflow: visible; }
    .odor-wisp path {
      fill: none;
      stroke: currentColor;
      stroke-width: 6.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* 옷의 목·어깨 라인 근처에서 짧게 피어오르도록 배치 */
    .odor-wisp.ow1 { left: 24%; top: 30%; transform: rotate(-12deg) scale(.82); animation-delay: 0s; }
    .odor-wisp.ow2 { right: 24%; top: 26%; transform: rotate(10deg) scale(.95); animation-delay: .55s; }
    .odor-wisp.ow3 { left: 46%; top: 22%; transform: rotate(-3deg) scale(.72); animation-delay: 1.05s; }
    .odor-wisp.ow4 { right: 16%; top: 33%; transform: rotate(18deg) scale(.68); animation-delay: 1.45s; }

    .odor-signs.soft .odor-wisp { opacity: .55; color: #B0BC4A; }
    .odor-signs.soft .ow3,
    .odor-signs.soft .ow4 { display: none; }
    .odor-signs.intense .odor-wisp {
      color: #82951E;
      opacity: .96;
      filter: drop-shadow(0 4px 7px rgba(78, 96, 16, .26));
    }
    @keyframes odorWispRise {
      0%, 100% { margin-top: 8px; opacity: .28; }
      45% { margin-top: -5px; opacity: 1; }
      72% { margin-top: -12px; opacity: .72; }
    }

    /* 냄새 정도: 1~5단계 중 현재 단계 하나만 점등 */
    .smell-stage-meter {
      margin: 22px 4px 0;
      text-align: left;
    }
    .smell-stage-title {
      font-size: 16px;
      font-weight: 850;
      letter-spacing: -.04em;
      margin-bottom: 12px;
      text-align: center;
    }
    .smell-stage-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .smell-stage-cell {
      min-width: 0;
      display: grid;
      grid-template-rows: 20px 22px;
      align-items: center;
      justify-items: center;
      gap: 5px;
      --stage-color: #AAB2BD;
    }
    .smell-stage-lamp {
      width: 100%;
      height: 17px;
      border-radius: 999px;

      border: 1px solid #D7DDE5;

    }
    .smell-stage-cell.active .smell-stage-lamp {

      box-shadow:
        0 0 0 3px color-mix(in srgb, var(--stage-color) 18%, transparent),
        0 0 14px color-mix(in srgb, var(--stage-color) 58%, transparent),
        inset 0 2px 4px rgba(255,255,255,.35);

    .smell-stage-cell.active .smell-stage-number {

    /* 자동 확인: 수분량과 건조 예상 시간만 표시 */

    .monitor-estimate-sub {

    .drying-speed-tag.slow { background: #FFF3D6; color: #B4720A; }
    .drying-speed-tag.stagnant { background: #FDE6E4; color: #C63A2E; }

    /* v55: 자동 확인 메인 화면 - 다음 측정까지 남은 시간 안내 문구 */
    .monitor-next-check {

    /* v55: 메인 화면 ↔ 결과 화면 좌우 스와이프 */
    .monitor-swipe-screen { padding-left: 0; padding-right: 0; }
    .monitor-swipe-wrap {
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .monitor-swipe-wrap::-webkit-scrollbar { display: none; }
    .monitor-swipe-track { display: flex; width: 100%; }
    .monitor-swipe-page {
      flex: 0 0 100%;

      scroll-snap-align: start;

    }
    .monitor-swipe-dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));

    .monitor-swipe-dots .dot {

    }

    /* v56: 메인/결과 화면이 좌우로 스와이프된다는 사실을 알려주는 안내 배지 */
    .monitor-swipe-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 2px 24px 0;
      padding: 9px 16px;

      font-size: 14px;
      animation: swipeHintNudge 1.3s ease-in-out infinite;
    }
    @keyframes swipeHintFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes swipeHintNudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(5px); }

    .monitor-result-card {

    /* 투명 배경 불꽃만 표시되도록 이미지 컨테이너의 배경·테두리 제거 */

    /* v56: 예열 버튼/타이머 - 흰색 원형 안에 사용자가 보내준 불꽃 사진을 담은 시각화.
       아래쪽(옅은 회색 아웃라인) 이미지 위에 같은 이미지를 진행률만큼 clip-path로 드러내
       마치 그라데이션처럼 서서히 채워지는 느낌을 표현합니다. */
    .warmup-ring-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .warmup-ring-btn {
      all: unset;
      cursor: pointer;
      width: 100%; height: 100%;

    .warmup-ring-visual {
      --flame-progress: 0%;

      aspect-ratio: 1;

      background: #fff;

      place-items: center;
      transition: transform .15s ease;

    .warmup-ring-visual .warmup-flame-progress { width: 52%; height: 52%; }
    .warmup-flame-button-copy {
      position: relative;
      display: block;
      margin-top: 10px;
      font-size: 19px;
      font-weight: 500;
      color: #111827;
      letter-spacing: -.02em;

      .monitor-drying-stat b { font-size: 28px; }
      .monitor-drying-stat.time b { font-size: 21px; }
      .monitor-drying-stat.time b.long-text { font-size: 15px; }
    }

    /* ===== v63: 자동 확인 STEP 2 — 완전한 옷걸이 + 중앙 결합형 슬림 모듈 ===== */
    .dock-rail-board-v3 {
      position: relative;
      width: 100%;
      max-width: 338px;
      height: 184px;
      margin: 1px auto 4px;
      padding: 3px 5px;
      overflow: hidden;
      border-radius: 24px;
      background: linear-gradient(145deg, #FBFFF8 0%, #E8F9DE 100%);
      border: 1px solid rgba(143,209,79,.28);
      box-shadow: inset 0 -18px 30px rgba(143,209,79,.08), 0 9px 22px rgba(16,23,34,.06);
    }
    .dock-rail-board-v3 svg {
      width: 100%;
      height: 176px;
      display: block;
      overflow: visible;
    }
    .dock-device-slide-v3 {
      transform-box: view-box;
      transform-origin: center;
      animation: dockDeviceSlideV3 3.15s cubic-bezier(.32,.72,.28,1) infinite;
      will-change: transform;
    }
    @keyframes dockDeviceSlideV3 {
      0%, 12% { transform: translateX(50px); }
      /* 기기의 상단 레일 왼쪽 끝이 모듈 결합 홈 끝까지 들어가도록 이동 거리를 확장 */
      52%, 79% { transform: translateX(-57px); }
      100% { transform: translateX(50px); }
    }
    .dock-slide-arrow-v3 {
      animation: dockSlideArrowV3 1.18s ease-in-out infinite;
      transform-origin: 224px 24px;

    .ble-connect-fab {

      content: '';

      box-shadow: 0 0 0 4px rgba(170,178,189,.14);

    .ble-connect-fab.connected {

      border-color: #F2C8C4;
      background: rgba(255,245,244,.97);
    }

    }

      0%, 100% { opacity: .45; transform: scale(.88); }
      50% { opacity: 1; transform: scale(1.08); }

    function formatHMS(total) {
      total = Math.max(0, Math.ceil(total));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    }

    // 건조까지 남은 시간 값의 글자 길이가 길 때(예: '약 12시간 30분')만 글자 크기를 줄여
    // 카드 안에서 줄바꿈 없이 한 줄로 들어가도록 합니다.
    function dryingEstimateTextClass(text) {
      return String(text).length >= 10 ? ' long-text' : '';
    }

    function formatDryingDuration(totalMinutes) {
      const rounded = Math.max(0, Math.round(Number(totalMinutes) / 10) * 10);
      const hours = Math.floor(rounded / 60);
      const minutes = rounded % 60;
      if (hours <= 0) return `약 ${Math.max(10, minutes)}분`;
      if (minutes === 0) return `약 ${hours}시간`;
      return `약 ${hours}시간 ${minutes}분`;
    }

    function resetDryingEstimator() {
      state.monitorStartedAt = 0;
      state.monitorInitialMoisture = 0;
      state.monitorMoistureSamples = [];
      state.monitorDryingEstimateMinutes = null;
    }

    function startDryingEstimator() {
      const value = clamp(Number(state.moistureValue) || 0, 0, 100);
      state.monitorStartedAt = now();
      state.monitorInitialMoisture = value;
      state.monitorMoistureSamples = [{
        at: state.monitorStartedAt,
        value,
        temp: Number(state.temp),
        humidity: Number(state.humidity)
      }];
      state.monitorDryingEstimateMinutes = null;
    }

    function hardwareMonitoringDryingProgress() {
      const initial = Number(state.monitorInitialMoisture);
      const current = clamp(Number(state.moistureValue) || 0, 0, 100);

      if (!state.monitorHasBaseline || !Number.isFinite(initial) || initial <= 0) {
        return 0;
      }

      return clamp(((initial - current) / initial) * 100, 0, 100);
    }

      };
      const samples = Array.isArray(state.monitorMoistureSamples) ? state.monitorMoistureSamples : [];
      const last = samples[samples.length - 1];
      if (last && last.at === sample.at && last.value === sample.value) return;
      samples.push(sample);
      if (samples.length > 24) samples.shift();
      state.monitorMoistureSamples = samples;
    }

    function getMonitoringElapsedSeconds() {
      if (!state.monitorStartedAt) return 0;
      const realElapsed = Math.max(0, (now() - state.monitorStartedAt) / 1000);
      const cycleElapsed = Math.max(0, Number(state.monitorCycleCount) || 0) * Math.max(1, Number(state.monitorCheckDurationSeconds) || 1800);
      return Math.max(realElapsed, cycleElapsed);
    }

    function calculateDryingEstimate() {
      const currentMoisture = clamp(Number(state.moistureValue) || 0, 0, 100);
      // 옷의 수분량이 10% 미만이면 건조 완료로 판단합니다.
      const dryCompletionThreshold = 10;
      const targetMoisture = 10;

      // 실제 건조 완료 표시는 ESP32의 dry_complete(M:D) 상태가 확정된 경우에만 사용합니다.
      // 잔여수분 값만 보고 먼저 '건조 완료'라고 표시하면 '정상 건조 중'과 모순될 수 있습니다.
      if (state.monitorDryComplete) {
        state.monitorDryingEstimateMinutes = 0;
        return { ready: true, text: '건조 완료', minutes: 0 };
      }

      const elapsedSeconds = getMonitoringElapsedSeconds();
      // 최초 측정값을 기준으로 30분 뒤의 두 번째 측정부터 남은 시간을 계산합니다.
      const samples = Array.isArray(state.monitorMoistureSamples) ? state.monitorMoistureSamples : [];
      if (samples.length < 2 || elapsedSeconds < 1800) {
        state.monitorDryingEstimateMinutes = null;
        return { ready: false, text: '30분 후 계산', minutes: null };
      }

      const initialMoisture = Math.max(currentMoisture, Number(state.monitorInitialMoisture) || currentMoisture);
      const elapsedHours = Math.max(0.5, elapsedSeconds / 3600);
      const moistureReductionRatio = Math.max(0, (initialMoisture - currentMoisture) / Math.max(1, initialMoisture));
      const reductionRatioPerHour = moistureReductionRatio / elapsedHours;
      const observedDropPerHour = initialMoisture * reductionRatioPerHour;

      if (observedDropPerHour < 0.25) {
        state.monitorDryingEstimateMinutes = null;
        return { ready: true, text: '수분 감소 정체', minutes: null };
      }

      const temperature = Number(state.temp);
      const humidity = Number(state.humidity);

      // 24℃·50%를 기준으로 현재 온도와 습도가 이후 건조 속도에 미칠 영향을 보정합니다.
      const temperatureFactor = Number.isFinite(temperature)
        ? clamp(0.72 + (temperature - 16) * 0.03, 0.55, 1.28)
        : 1;
      const humidityFactor = Number.isFinite(humidity)
        ? clamp(1.18 - (humidity - 40) * 0.012, 0.42, 1.2)
        : 1;
      const environmentFactor = clamp(temperatureFactor * humidityFactor, 0.38, 1.35);
      const predictedDropPerHour = Math.max(0.2, observedDropPerHour * environmentFactor);

      // 정확히 10%인 경우에는 아직 '10% 미만'이 아니므로 최소 잔여량을 두어 완료 화면이 미리 뜨지 않게 합니다.
      const remainingMoisture = Math.max(0.1, currentMoisture - targetMoisture);
      const remainingHours = clamp(remainingMoisture / predictedDropPerHour, 0, 48);
      const remainingMinutes = Math.max(10, Math.round(remainingHours * 60));
      state.monitorDryingEstimateMinutes = remainingMinutes;

      if (remainingHours >= 48) return { ready: true, text: '48시간 이상', minutes: remainingMinutes };
      return { ready: true, text: formatDryingDuration(remainingMinutes), minutes: remainingMinutes };
    }

    // 자동 확인 메인 화면 가운데 표시:
    // 정상 건조 중입니다.(초록) / 건조 속도가 느립니다.(연노랑, 수분 정체 감지) / 냄새 성분이 증가했습니다.(연빨강, 수분 정체 + 냄새 증가)
    function getDryingSpeedStatus() {
      if (state.hardwareMonitoringActive && !state.monitorHasBaseline) {
        return { label: '의류 상태를 확인 중입니다.', tone: 'normal' };
      }
      if (state.monitorStagnationActive) {
        // 수분 정체 감지와 냄새(VOC) 증가 감지는 분석 결과 화면에서 모두 '주의(노란색)'로 표시되므로,
        // 메인 화면의 LED 링 색상도 동일하게 tone: 'caution'(노란색) 하나로 통일합니다.
        const odorIncreasing = (Number(state.monitorIncreaseStreak) || 0) > 0;
        if (odorIncreasing) return { label: '냄새 성분이 증가했습니다.', tone: 'caution' };
        return { label: '건조 속도가 느립니다.', tone: 'caution' };
      }
      return { label: '정상 건조 중입니다.', tone: 'normal' };
    }

    function smellStageFromValue(value) {
      return clamp(Math.floor(clamp(Number(value) || 0, 0, 100) / 20) + 1, 1, 5);
    }

    function renderSmellStageMeter(value) {
      const activeStage = smellStageFromValue(value);
      const colors = ['#0A84FF', '#30D158', '#FFD60A', '#FF9F0A', '#FF453A'];
      return `<div class="smell-stage-meter" aria-label="냄새 정도 ${activeStage}단계">
        <div class="smell-stage-title">냄새 정도</div>
        <div class="smell-stage-grid">
          ${colors.map((color, index) => {
            const stage = index + 1;
            return `<div class="smell-stage-cell ${stage === activeStage ? 'active' : ''}" style="--stage-color:${color}" aria-current="${stage === activeStage ? 'true' : 'false'}">
              <span class="smell-stage-lamp"></span>
              <span class="smell-stage-number">${stage}</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }

    function odorWispSetHTML(intense = false) {
      return `<div class="odor-signs ${intense ? 'intense' : 'soft'}" aria-hidden="true">
        <span class="odor-wisp ow1"><svg viewBox="0 0 44 96"><path d="M29 92C7 78 39 64 18 49C2 37 38 24 22 5"/></svg></span>
        <span class="odor-wisp ow2"><svg viewBox="0 0 44 96"><path d="M16 91C39 76 8 62 29 47C44 35 8 22 25 4"/></svg></span>
        <span class="odor-wisp ow3"><svg viewBox="0 0 44 96"><path d="M30 92C8 78 37 67 17 51C4 40 37 27 22 7"/></svg></span>
        <span class="odor-wisp ow4"><svg viewBox="0 0 44 96"><path d="M15 91C38 76 10 64 29 48C42 36 9 23 24 5"/></svg></span>
      </div>`;
    }

    function remainingWarmupSeconds() {
      return state.warmupEndTime ? Math.max(0, Math.ceil((state.warmupEndTime - now()) / 1000)) : 0;
    }
    function remainingAnalysisSeconds() {
      return state.analysisEndTime ? Math.max(0, Math.ceil((state.analysisEndTime - now()) / 1000)) : 0;
    }
    function diagnosisAnalysisProgressPercent() {
      if (!state.analysisStartTime || !state.analysisEndTime) return 0;
      const totalMs = Math.max(1, state.analysisEndTime - state.analysisStartTime);
      const elapsedMs = clamp(now() - state.analysisStartTime, 0, totalMs);
      return clamp((elapsedMs / totalMs) * 100, 0, 100);
    }
    function finiteOptionalNumber(value) {
      if (value === null || value === undefined || value === '') return null;
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }
    function remainingMonitorSeconds() {
      return state.monitorNextCheckAt ? Math.max(0, Math.ceil((state.monitorNextCheckAt - now()) / 1000)) : 0;
    }
    function isWarmupRunning() { return state.warmupEndTime && remainingWarmupSeconds() > 0; }
    function isReadyActive() { return state.readySince && (!state.idleTimeoutAt || now() < state.idleTimeoutAt); }

    function persistWarmup() {
      localStorage.setItem('warmupEndTime', String(state.warmupEndTime || 0));
      localStorage.setItem('readySince', String(state.readySince || 0));
      localStorage.setItem('idleTimeoutAt', String(state.idleTimeoutAt || 0));
    }

    function setScreen(screen) {
      state.screen = screen;
      render();
    }

    function showToast(message) {
      // 시연용 검정 상단 알림은 사용자 요청에 따라 표시하지 않습니다.
      return;
    }

    function getFirebaseInputSnapshot() {
      const firebaseData = state.firebaseLastData || null;
      const input = firebaseData?.input || {};
      const weather = firebaseData?.weather || {};

      const packetTemperature = finiteOptionalNumber(weather.temperature);
      const packetHumidity = finiteOptionalNumber(weather.humidity);

      return {
        hasFirebaseData: !!firebaseData,
        smellLevel: finiteOptionalNumber(input.smellStagnation) !== null ? clamp(finiteOptionalNumber(input.smellStagnation), 0, 100) : state.odorLevel,
        moistureLevel: finiteOptionalNumber(input.moistureStagnation) !== null ? clamp(finiteOptionalNumber(input.moistureStagnation), 0, 100) : state.moistureValue,
        temperature: firebaseData ? packetTemperature : state.temp,
        humidity: firebaseData ? packetHumidity : state.humidity
      };
    }

    function calculateWeatherRiskForApp(temperature, humidity) {
      let weatherRisk = 0;

      if (humidity >= 85) weatherRisk += 40;
      else if (humidity >= 70) weatherRisk += 30;
      else if (humidity >= 55) weatherRisk += 20;
      else weatherRisk += 10;

      if (temperature >= 30) weatherRisk += 30;
      else if (temperature >= 24) weatherRisk += 20;
      else if (temperature >= 15) weatherRisk += 10;
      else weatherRisk += 5;

      return weatherRisk;
    }

    function getAppDiagnosis() {
      const snapshot = getFirebaseInputSnapshot();
      const weatherRisk = calculateWeatherRiskForApp(snapshot.temperature, snapshot.humidity);

      // 냄새 정도는 냄새 강도만을 기준으로 표시합니다.
      // 수분량은 냄새 정도 계산에는 포함하지 않고, 15% 초과 여부로 착용 비추천을 우선 판단합니다.
      const riskScore = Math.round(snapshot.smellLevel);
      const moistureHigh = snapshot.moistureLevel > 15;

      let smellLevelLabel;
      let smellResult;

      if (riskScore >= 75) {
        smellLevelLabel = '높음';
        smellResult = {
          resultCode: 'not_wearable',
          color: 'var(--red)',
          emoji: '!',
          title: '착용 비추천',
          label: '높음',
          message: '측정된 냄새 강도가 높아 착용을 권장하지 않아요.'
        };
      } else if (riskScore >= 25) {
        smellLevelLabel = '주의';
        smellResult = {
          resultCode: 'caution',
          color: 'var(--yellow)',
          emoji: '?',
          title: '주의',
          label: '중간',
          message: '냄새 성분이 일부 감지되어, 착용 전 한 번 더 확인하는 것을 권장해요.'
        };
      } else {
        smellLevelLabel = '낮음';
        smellResult = {
          resultCode: 'wearable',
          color: 'var(--blue)',
          emoji: '✓',
          title: '착용 가능',
          label: '낮음',
          message: '냄새 성분이 낮게 감지되어 안심하고 착용해도 괜찮습니다.'
        };
      }

      if (moistureHigh) {
        let moistureMessage;

        if (smellLevelLabel === '낮음') {
          moistureMessage = '냄새 위험은 낮지만, 잔여 수분이 확인되어 착용을 권장하지 않아요.';
        } else if (smellLevelLabel === '주의') {
          moistureMessage = '냄새 성분이 일부 감지되었으며, 잔여 수분이 확인되어 착용을 권장하지 않아요.';
        } else {
          moistureMessage = '냄새가 강하게 감지되었고, 잔여 수분이 확인되어 착용을 권장하지 않아요.';
        }

        return {
          ...snapshot,
          weatherRisk,
          riskScore,
          smellLevelLabel,
          moistureHigh,
          resultCode: 'not_wearable',
          color: 'var(--red)',
          emoji: '!',
          title: '착용 비추천',
          label: '잔여 수분 확인',
          message: moistureMessage
        };
      }

      return {
        ...snapshot,
        weatherRisk,
        riskScore,
        smellLevelLabel,
        moistureHigh,
        ...smellResult
      };
    }

    function resultInfo(level = state.odorLevel) {
      // Firebase에서는 input/weather 값만 가져오고, 최종 판단 문구와 위험도는 앱 HTML 내부 로직으로 계산합니다.
      if (state.firebaseLastData) {
        const diagnosis = getAppDiagnosis();
        return {
          color: diagnosis.color,
          emoji: diagnosis.emoji,
          title: diagnosis.title,
          label: diagnosis.label
        };
      }

      // 기존 데모 결과 색상 알고리즘
      // 1) 잔여 수분이 있으면 냄새 강도와 무관하게 착용 불가로 표시합니다.
      // 2) 잔여 수분이 없을 때만 냄새 강도에 따라 파랑/노랑/빨강을 표시합니다.
      if (state.moistureRemaining) {
        return { color: 'var(--red)', emoji: '!', title: '착용 비추천', label: '잔여 수분 확인' };
      }
      if (level < THRESHOLDS.cleanMax) {
        return { color: 'var(--blue)', emoji: '✓', title: '착용 가능', label: '낮음' };
      }
      if (level < THRESHOLDS.unclearMax) {
        return { color: 'var(--yellow)', emoji: '?', title: '주의', label: '중간' };
      }
      return { color: 'var(--red)', emoji: '!', title: '착용 비추천', label: '높음' };
    }


    function buildHeader({ showToggle = true, forceHome = false } = {}) {
      const homeLike = ['diagnosisHome', 'monitorAttach'].includes(state.screen);
      const analysisLike = state.screen === 'analysis';
      const left = homeLike && !forceHome
        ? `<button class="icon-btn" onclick="openMenu()" aria-label="메뉴 열기">${iconMenu()}</button>`
        : `<button class="icon-btn circle ${analysisLike ? 'disabled' : ''}" onclick="goHome()" aria-label="홈으로">${iconHome()}</button>`;
      const toggle = showToggle ? modeToggle() : '';
      return `<div class="topbar">${left}<div>${toggle}</div><div></div></div>`;
    }

    function modeToggle() {
      return `<div class="mode-toggle ${state.mode === 'monitoring' ? 'monitoring' : ''}">
        <span class="mode-pill"></span>
        <button class="mode-tab ${state.mode === 'diagnosis' ? 'active' : ''}" onclick="switchMode('diagnosis')">바로 진단</button>
        <button class="mode-tab ${state.mode === 'monitoring' ? 'active' : ''}" onclick="switchMode('monitoring')">자동 확인</button>
      </div>`;
    }

    function switchMode(mode) {
      state.mode = mode;
      if (mode === 'monitoring') {
        state.screen = state.monitorMounted ? 'monitorWait' : 'monitorAttach';
      } else {
        state.screen = 'diagnosisHome';
      }
      render();
    }

    function resetMonitoringToAttach() {
      // 모니터링 흐름을 종료하고, 30분마다 측정하는 예약도 함께 멈춥니다.
      state.monitorMounted = false;
      state.monitorHasBaseline = false;
      state.monitorNextCheckAt = 0;
      state.monitorCycleCount = 0;
      state.monitorStagnationStart = 0;
      state.monitorStagnationActive = false;
      state.monitorOdorDetected = false;
      state.monitorOdorLevel = state.odorLevel;
      state.monitorStagnationCycles = 0;
      state.monitorStagnationCheckCount = 0;
      state.monitorOdorHistory = [];
      state.monitorOdorIncreaseCount = 0;
      state.monitorAlertedIncreaseMarks = [];
      state.monitorLastMeasuredOdor = null;
      state.monitorVocStartLogged = false;
      state.monitorEnded = false;
      state.monitorTimeline = [];
      state.monitorAlerts = { firstSent: false, finalSent: false, lastAlertHours: 0, phoneSent: false };
      state.monitorIncreaseStreak = 0;
      state.monitorVocPhase = 'idle';
      state.monitorDryComplete = false;
      state.monitorRewashAlert = false;
      state.monitorHasResult = false;
      state.monitorLastResultAt = 0;
      state.monitorPanelIndex = 0;
      state.monitorSwipeHintSeen = false;
      state.monitorVirtualNowMs = 0;
      resetDryingEstimator();
      state.warmupEndTime = 0;
      state.analysisEndTime = 0;
      state.mode = 'monitoring';
      state.screen = 'monitorAttach';
      persistWarmup();
      render();
    }

    function goHome() {
      if (state.screen === 'analysis') return; // 바로 진단 분석 중에는 홈 이동을 막습니다. (자동 확인의 VOC 분석은 화면 전환 없이 배경에서 진행되므로 막지 않습니다.)
      const monitorScreens = ['monitorAttach', 'monitorWait'];
      if (monitorScreens.includes(state.screen) || state.mode === 'monitoring') {
        if (state.hardwareMonitoringActive) {
          sendBleCommand('STOP_MONITORING');
        }
        state.hardwareMonitoringActive = false;
        resetMonitoringToAttach();
        return;
      }
      state.mode = 'diagnosis';
      state.screen = 'diagnosisHome';
      render();
      // 메인 화면으로 돌아오면 다음 BOOT를 다시 첫 예열 버튼으로 맞춥니다.
      sendBleCommand('APP_STATE:DIAGNOSIS_HOME_COLD');
    }

    async function startWarmup() {
      // BLE 응답이 매우 빨리 도착해도 READY가 먼저 처리되는 경쟁 상태를 막기 위해
      // 명령 전송 전에 예열 화면과 10초 기준 시각을 먼저 확정합니다.
      state.warmupDurationSeconds = 10;
      localStorage.setItem('warmupDurationSeconds', '10');
      ipjimayoWarmupStartedAt = now();
      ipjimayoWarmupReadyReceived = false;
      ipjimayoWarmupAwaitingDeviceStart = true;
      // 화면은 즉시 보여주고, ESP32의 D:W가 도착하면 실제 장치 시작 시각으로 한 번 정확히 맞춥니다.
      state.warmupEndTime = ipjimayoWarmupStartedAt + 10000;
      state.readySince = 0;
      state.idleTimeoutAt = 0;
      persistWarmup();
      state.mode = 'diagnosis';
      state.screen = 'warmup';
      render();

      const sent = await sendBleCommand('START_WARMUP');
      if (!sent) {
        ipjimayoWarmupStartedAt = 0;
        ipjimayoWarmupReadyReceived = false;
        ipjimayoWarmupAwaitingDeviceStart = false;
        state.warmupEndTime = 0;
        state.screen = 'diagnosisHome';
        persistWarmup();
        render();
        return;
      }

      showToast('기기에 예열 시작 명령을 보냈어요.');
    }

    function completeWarmup(fromAlways = false) {
      // 화면의 10초가 정확히 끝나는 순간 바로 준비 완료로 전환합니다.
      // ESP32도 D:W를 보낸 시점부터 자체적으로 같은 10초를 계산하므로 READY 알림 지연을 기다리지 않습니다.
      if (!fromAlways && state.screen === 'warmup' && state.warmupEndTime && now() < state.warmupEndTime) {
        return false;
      }

      state.warmupEndTime = 0;
      state.readySince = now();
      state.idleTimeoutAt = state.warmupType === 'scheduled' ? now() + state.readyIdleLimitSeconds * 1000 : 0;
      persistWarmup();
      state.mode = 'diagnosis';
      state.screen = 'ready';
      ipjimayoWarmupStartedAt = 0;
      ipjimayoWarmupReadyReceived = false;
      ipjimayoWarmupAwaitingDeviceStart = false;
      if (!fromAlways) showToast('예열이 완료되었어요. 이제 옷감에 가까이 대고 측정해주세요.');
      render();
      return true;
    }

    function cancelWarmup() {
      state.warmupEndTime = 0;
      ipjimayoWarmupStartedAt = 0;
      ipjimayoWarmupReadyReceived = false;
      ipjimayoWarmupAwaitingDeviceStart = false;
      state.readySince = 0;
      state.idleTimeoutAt = 0;
      persistWarmup();
      state.screen = 'diagnosisHome';
      render();
    }

    function showIdleTimeout() {
      if (state.warmupType !== 'scheduled') return;
      state.warmupEndTime = 0;
      state.readySince = 0;
      state.idleTimeoutAt = 0;
      persistWarmup();
      state.screen = 'timeout';
      showToast('10분 동안 측정이 없어 대기 모드로 전환했어요.');
      render();
    }

    function startDiagnosisAnalysis() {
      if (state.onboardingPopupOpen || state.screen === 'warmup' || state.mode !== 'diagnosis') return;
      state.warmupEndTime = 0;
      state.readySince = 0;
      state.idleTimeoutAt = 0;
      persistWarmup();
      state.analysisContext = 'diagnosis';
      state.analysisEndTime = now() + state.analysisDurationSeconds * 1000;
      state.screen = 'analysis';
      render();
    }

    function completeAnalysis() {
      if (!state.analysisEndTime) return; // 진행 중인 분석이 없으면 아무 것도 하지 않습니다.
      state.analysisEndTime = 0;
      if (state.analysisContext === 'monitoring') {
        finishMonitoringAnalysis();
      } else {
        state.screen = 'result';
        render();
      }
    }

    // 데모 제어판 전용: 현재 상황에 맞는 예열을 안전하게(진행 중일 때만) 즉시 완료시킵니다.
    function demoSkipWarmup() {
      if (state.monitorVocPhase === 'warmup') {
        completeMonitoringWarmup();
      } else if (state.warmupEndTime) {
        completeWarmup();
      }
    }

    // 데모 제어판 전용: 예열이 남아있다면 함께 건너뛰고, 분석까지 안전하게(진행 중일 때만) 즉시 완료시킵니다.
    function demoSkipAnalysis() {
      if (state.monitorVocPhase === 'warmup' && state.warmupEndTime) {
        completeMonitoringWarmup();
      }
      completeAnalysis();
    }

    let odorDebounce = null;
    function onOdorSlider(value) {
      state.odorLevel = Number(value);
      renderDemoPanel();
      if (state.screen === 'result') render();
      clearTimeout(odorDebounce);
      odorDebounce = setTimeout(() => {
        if (!state.onboardingPopupOpen && state.mode === 'diagnosis' && !['warmup', 'analysis'].includes(state.screen)) {
          startDiagnosisAnalysis();
        }
      }, 450);
    }

    function onMoistureToggle(hasMoisture) {
      state.moistureRemaining = hasMoisture;
      if (state.screen === 'result') render();
      renderDemoPanel();
    }

    function scheduleTimeChanged(value) {
      state.scheduledTime = value || '07:30';
      localStorage.setItem('scheduledTime', state.scheduledTime);
      const [h, m] = state.scheduledTime.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      if (d.getTime() <= now()) d.setDate(d.getDate() + 1);
      state.scheduledTimestamp = d.getTime();
      localStorage.setItem('scheduledTimestamp', String(state.scheduledTimestamp));
      showToast(`${state.scheduledTime}에 예열이 시작되도록 예약했어요.`);
      renderSettings();
    }

    function simulateAlarm() {
      if (state.warmupType !== 'scheduled') {
        showToast('상시 예열 상태에서는 알람 예열이 필요하지 않아요.');
        return;
      }
      closeSheet();
      closeMenu();
      startWarmup();
    }

    function cradleConnected() {
      state.warmupEndTime = 0;
      state.readySince = 0;
      state.idleTimeoutAt = 0;
      state.monitorMounted = false;
      state.monitorHasBaseline = false;
      state.monitorNextCheckAt = 0;
      state.monitorStagnationActive = false;
      persistWarmup();
      state.mode = 'diagnosis';
      state.screen = 'diagnosisHome';
      showToast('🔋 크래들에 연결되었습니다. 충전을 시작합니다.');
      render();
    }

    function setWarmupType(type) {
      state.warmupType = type;
      localStorage.setItem('warmupType', type);
      if (type === 'always') {
        closeSheet();
        state.mode = 'diagnosis';
        completeWarmup(true);
        showToast('상시 예열로 변경했어요. 예열 단계를 건너뛰고 측정 안내로 이동합니다.');
      } else {
        // 상시 예열 상태에서 넘어온 경우, 남아있던 준비완료 상태를 초기화해서
        // 홈 화면에 "상시 예열 상태" 배너가 계속 떠 있지 않도록 합니다.
        state.readySince = 0;
        state.idleTimeoutAt = 0;
        state.warmupEndTime = 0;
        persistWarmup();
        if (['ready', 'warmup'].includes(state.screen)) {
          state.mode = 'diagnosis';
          state.screen = 'diagnosisHome';
        }
        showToast('필요 시 예열로 변경했어요.');
      }
      render();
    }

    function clockTimeString(ts) {
      const d = new Date(ts || now());
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function logMonitorEvent(label, tone = 'normal') {
      const stampAt = state.monitorVirtualNowMs || now();
      state.monitorTimeline.push({ time: clockTimeString(stampAt), label, tone, notes: [] });
      if (state.sheet === 'timeline') renderTimeline();
    }

    // 알림 전송처럼 측정 자체는 아니지만 참고할 만한 이벤트는 새 점(행)을 만들지 않고,
    // 가장 최근 측정 행에 작은 보조 문구로만 덧붙입니다.
    function attachAlertNote(text) {
      const items = state.monitorTimeline;
      if (!items.length) {
        logMonitorEvent(text, 'warn');
        return;
      }
      const last = items[items.length - 1];
      if (!Array.isArray(last.notes)) last.notes = [];
      last.notes.push(text);
      if (state.sheet === 'timeline') renderTimeline();
    }

    // 새로운 정체 구간이 시작될 때, 이전 정체 구간에서 누적됐던 값들을 모두 초기화합니다.
    // 이렇게 해야 알림 문구의 "최근 N시간"이 이번 정체가 감지된 시점을 기준으로 새로 측정됩니다.
    function beginStagnationEpisode() {
      state.monitorStagnationCycles = 0;
      state.monitorStagnationCheckCount = 0;
      state.monitorOdorHistory = [];
      state.monitorOdorIncreaseCount = 0;
      state.monitorAlertedIncreaseMarks = [];
      state.monitorLastMeasuredOdor = null;
      state.monitorIncreaseStreak = 0;
      state.monitorVocStartLogged = false;
      state.monitorAlerts = { firstSent: false, finalSent: false, lastAlertHours: 0, phoneSent: false };
    }

    // v57: 냄새 증가 횟수(3/5/7회)에 따른 별도의 "경고 알림 전송" 푸시/타임라인 기록은
    // 더 이상 보내지 않습니다. 알림은 evaluateMonitorAlerts()의 환경 개선 권장 알림 하나만 사용합니다.
    function maybeSendPhoneAlertForIncreaseCount() {
      // 의도적으로 아무 것도 하지 않습니다.
    }

    function registerStagnationMeasurement() {
      const currentLevel = clamp(Number(state.odorLevel), 0, 100);
      const previousLevel = Number.isFinite(Number(state.monitorLastMeasuredOdor))
        ? Number(state.monitorLastMeasuredOdor)
        : null;

      state.monitorStagnationCheckCount = Math.max(0, Number(state.monitorStagnationCheckCount) || 0) + 1;

      if (previousLevel !== null && currentLevel > previousLevel) {
        state.monitorOdorIncreaseCount = Math.max(0, Number(state.monitorOdorIncreaseCount) || 0) + 1;
        state.monitorIncreaseStreak = Math.max(0, Number(state.monitorIncreaseStreak) || 0) + 1;
        maybeSendPhoneAlertForIncreaseCount();
      } else if (previousLevel !== null && currentLevel <= previousLevel) {
        state.monitorIncreaseStreak = 0;
      }

      state.monitorLastMeasuredOdor = currentLevel;
      state.monitorOdorLevel = currentLevel;
    }

    function mountMonitoringDevice() {
      state.monitorMounted = true;
      state.monitorHasBaseline = true;
      state.monitorCycleCount = 0;
      state.monitorStagnationActive = false;
      state.monitorStagnationCycles = 0;
      state.monitorStagnationCheckCount = 0;
      state.monitorOdorHistory = [];
      state.monitorOdorIncreaseCount = 0;
      state.monitorAlertedIncreaseMarks = [];
      state.monitorLastMeasuredOdor = null;
      state.monitorVocStartLogged = false;
      state.monitorEnded = false;
      state.monitorTimeline = [];
      state.monitorAlerts = { firstSent: false, finalSent: false, lastAlertHours: 0, phoneSent: false };
      state.monitorIncreaseStreak = 0;
      state.monitorVocPhase = 'idle';
      state.monitorDryComplete = false;
      state.monitorRewashAlert = false;
      state.monitorHasResult = false;
      state.monitorLastResultAt = 0;
      state.monitorPanelIndex = 0;
      state.monitorSwipeHintSeen = false;
      state.monitorVirtualNowMs = now(); // 진행 상황 시간은 실제 시계가 아니라 30분 단위 가상 측정 시각으로 표시합니다.
      state.odorLevel = 15; // 갓 세탁한 상태이므로 냄새 강도를 낮은 값으로 초기화합니다.
      state.monitorOdorLevel = 15;
      state.prevMoistureValue = state.moistureValue;
      startDryingEstimator();
      state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;
      state.screen = 'monitorWait';
      logMonitorEvent('건조 시작');
      render();
    }

    // v55: '정상으로 감소' 안내 화면과 '수분 정체 → VOC 분석 중' 안내 화면을 완전히 없애고,
    // 항상 메인 화면(monitorWait)에 머무른 채로 배경에서 계산만 진행합니다.
    // 건조 완료 역시 별도 화면 대신 메인 화면 안에서 상태로 표시합니다(state.monitorDryComplete).
    function monitorCheck({ stagnation = false, dry = false } = {}) {
      state.monitorCycleCount += 1;
      // 기기는 30분마다 자동으로 측정하므로, 진행 상황 시간도 실제 시계 대신 30분씩 늘어나는 가상 시각으로 기록합니다.
      state.monitorVirtualNowMs = (state.monitorVirtualNowMs || now()) + state.monitorCheckDurationSeconds * 1000;
      if (dry) {
        state.moistureValue = 0;
        const drySampleAt = state.monitorStartedAt
          ? Math.max(now(), state.monitorStartedAt + state.monitorCycleCount * state.monitorCheckDurationSeconds * 1000)
          : now();
        recordDryingMoistureSample(state.moistureValue, drySampleAt);
        // 건조 완료 이후에는 30분마다 반복 측정하는 흐름을 멈춥니다.
        state.monitorMounted = false;
        state.monitorHasBaseline = false;
        state.monitorNextCheckAt = 0;
        state.monitorStagnationActive = false;
        state.monitorStagnationStart = 0;
        state.monitorDryComplete = true;
        logMonitorEvent('건조 완료');
        notifyDryingComplete();
        render();
        return;
      }
      const old = state.prevMoistureValue;
      // 데모에서 "수분 정체"는 실제 감소량이 0일 때만 발생하도록 합니다.
      const drop = stagnation ? 0 : Math.max(1, Math.round(6 + Math.random() * 12));
      state.moistureValue = clamp(old - drop, 0, 100);
      state.prevMoistureValue = old;
      const sampleAt = state.monitorStartedAt
        ? Math.max(now(), state.monitorStartedAt + state.monitorCycleCount * state.monitorCheckDurationSeconds * 1000)
        : now();
      recordDryingMoistureSample(state.moistureValue, sampleAt);
      if (stagnation) {
        const isFirstStagnation = !state.monitorStagnationActive;
        const isVocFlowRunning = state.monitorVocPhase !== 'idle';
        state.monitorStagnationActive = true;
        if (!state.monitorStagnationStart) state.monitorStagnationStart = now() - state.monitorCycleCount * 1800 * 1000;
        if (isFirstStagnation) {
          beginStagnationEpisode();
          logMonitorEvent('수분 정체 감지', 'warn');
        } else {
          // 두 번째 수분 정체 확인부터는 VOC 센서가 이미 예열되어 있어 냄새와 수분을 함께 측정할 수 있고,
          // 이때부터 "연속 증가 횟수(N)"를 세기 시작합니다.
          registerStagnationMeasurement();
        }
        if (!isVocFlowRunning) {
          state.warmupEndTime = now() + state.warmupDurationSeconds * 1000;
          state.monitorVocPhase = 'warmup';
        }
      } else if (state.moistureValue < 10) {
        // 수분량이 10% 미만으로 내려가면 건조 완료로 판단하고 반복 측정 흐름을 멈춥니다.
        state.monitorMounted = false;
        state.monitorHasBaseline = false;
        state.monitorNextCheckAt = 0;
        state.monitorStagnationActive = false;
        state.monitorStagnationStart = 0;
        state.monitorDryComplete = true;
        logMonitorEvent('건조 완료');
        notifyDryingComplete();
      } else {
        // 수분이 다시 정상적으로 줄어들기 시작하면 "정체 상태"를 해제합니다.
        // (다음에 다시 정체가 감지되면 새로운 정체 구간으로 취급되어 알림 카운트가 새로 시작됩니다.)
        state.monitorStagnationActive = false;
        state.monitorStagnationStart = 0;
        logMonitorEvent('수분 감소 확인');
        // 정상 건조 중에는 별도 안내 화면 없이 상태만 갱신합니다.
        // 단, 첫 번째 수분 정체가 감지되어 분석이 끝나기 전까지는
        // "아직 분석 결과가 없어요" 화면을 계속 보여주고, 분석이 한 번이라도
        // 끝난 뒤부터는 최근 결과 패널을 그대로 이어서 보여줍니다.
        if (state.monitorHasResult) {
          state.monitorLastResultAt = state.monitorVirtualNowMs || now();
        }
        continueMonitoringLoop();
        return;
      }
      render();
    }

    function continueMonitoringLoop() {
      state.prevMoistureValue = state.moistureValue;
      state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;
      state.screen = 'monitorWait';
      render();
    }

    function startMonitoringWarmup() {
      if (!state.monitorStagnationStart) state.monitorStagnationStart = now();
      state.warmupEndTime = now() + state.warmupDurationSeconds * 1000;
      state.monitorVocPhase = 'warmup';
      render();
    }

    function completeMonitoringWarmup() {
      if (!state.warmupEndTime) return; // 진행 중인 예열이 없으면 아무 것도 하지 않습니다.
      state.warmupEndTime = 0;
      state.analysisContext = 'monitoring';
      state.analysisEndTime = now() + state.analysisDurationSeconds * 1000;
      state.monitorVocStartLogged = true;
      state.monitorVocPhase = 'analysis';
      render();
    }

    function monitoringNoOdorLoop() {
      state.prevMoistureValue = state.moistureValue;
      state.monitorHasBaseline = true;
      state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;
      state.screen = 'monitorWait';
      render();
    }

    // 냄새(VOC) 분석 완료 처리: 이력 누적 + 알림 평가 후, 화면 전환 없이 결과 패널만 갱신하고 30분 타이머를 재시작합니다.
    function finishMonitoringAnalysis() {
      state.monitorOdorLevel = clamp(Number(state.odorLevel), 0, 100);
      state.monitorOdorDetected = state.monitorOdorLevel >= THRESHOLDS.odorDetectedMin;
      state.monitorStagnationCycles += 1;

      // Firebase/BME 측정값이 먼저 들어와 registerStagnationMeasurement()에서 이미 증가 횟수를 기록합니다.
      // 타이머가 끝나 결과 패널로 반영될 때는 같은 측정을 다시 증가로 세지 않고, 이력만 누적합니다.
      if (state.monitorStagnationCheckCount <= 0) {
        registerStagnationMeasurement();
      } else {
        state.monitorLastMeasuredOdor = state.monitorOdorLevel;
      }

      state.monitorOdorHistory.push(state.monitorOdorLevel);
      if (state.monitorOdorHistory.length > 20) state.monitorOdorHistory.shift();

      maybeSendPhoneAlertForIncreaseCount();
      evaluateMonitorAlerts();
      state.monitorVocPhase = 'idle';
      state.monitorHasResult = true;
      state.monitorLastResultAt = state.monitorVirtualNowMs || now();

      if (state.monitorEnded) {
        // 임계 수준 초과로 자동 확인이 종료된 경우: 장착 안내 화면 대신 '재세탁을 권장해요' 화면을 보여줍니다.
        state.monitorMounted = false;
        state.monitorHasBaseline = false;
        state.monitorNextCheckAt = 0;
        state.monitorRewashAlert = true;
        render();
        return;
      }

      // 결과를 확인하는 별도 화면 없이 바로 다음 30분 타이머를 시작합니다.
      continueMonitoringLoop();
    }

    // 결과 화면의 확인 버튼: 다음 측정까지 남은 시간을 보여주는 화면으로 복귀
    function acknowledgeMonitorResult() {
      if (state.monitorEnded) {
        state.monitorMounted = false;
        state.monitorHasBaseline = false;
        state.monitorNextCheckAt = 0;
        state.monitorRewashAlert = true;
        render();
        return;
      }
      state.prevMoistureValue = state.moistureValue;
      state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;
      state.screen = 'monitorWait';
      render();
    }

    // PUSH 알림 평가: 1시간 지속 증가(첫 경고) → 2시간 간격 반복 경고(3h,5h,7h...) → 임계 초과 시 종료
    // 시간 계산은 실제 시계가 아니라 "측정 사이클 수 × 측정 간격"을 기준으로 하므로,
    // 데모에서 버튼을 연달아 눌러도 실제 대기 시간과 무관하게 정확히 진행됩니다.
    function evaluateMonitorAlerts() {
      const level = state.monitorOdorLevel;
      const isHigh = level >= THRESHOLDS.unclearMax;
      const intervalHours = state.monitorCheckDurationSeconds / 3600;
      const hoursOfIncrease = state.monitorIncreaseStreak * intervalHours;

      // 핸드폰 알림은 냄새 정도가 상승한 누적 횟수 3·5·7회에 맞춰 registerStagnationMeasurement()에서 처리합니다.
      maybeSendPhoneAlertForIncreaseCount();

      if (isHigh && !state.monitorAlerts.finalSent) {
        state.monitorAlerts.finalSent = true;
        state.monitorEnded = true;
        pushNotify('냄새가 임계 수준에 도달하였으므로 재세탁을 권장합니다. 자동 확인을 종료합니다.', { tone: 'danger', icon: '🚨' });
        logMonitorEvent('모니터링 종료', 'danger');
        return;
      }

      if (!state.monitorAlerts.firstSent) {
        if (hoursOfIncrease >= 1) {
          state.monitorAlerts.firstSent = true;
          state.monitorAlerts.lastAlertHours = hoursOfIncrease;
          pushNotify('최근 1시간 동안 냄새 성분이 지속적으로 증가했습니다. 환기 또는 제습을 권장합니다.', { tone: 'warn', icon: '⚠️' });
          attachAlertNote('📱경고 알림 전송');
        }
        return;
      }

      if (!state.monitorAlerts.finalSent && hoursOfIncrease - state.monitorAlerts.lastAlertHours >= 2) {
        state.monitorAlerts.lastAlertHours = hoursOfIncrease;
        const roundedHours = Math.round(hoursOfIncrease * 10) / 10;
        pushNotify(`최근 ${roundedHours}시간 동안 냄새 증가가 계속 확인되고 있습니다.`, { tone: 'warn', icon: '⚠️' });
        attachAlertNote('📱경고 알림 전송');
      }
    }

    // 건조 완료 알림
    function notifyDryingComplete() {
      pushNotify('건조가 완료되었습니다. 옷을 착용하거나 보관해도 좋아요.', { tone: 'success', icon: '✅' });
    }

    // PUSH 알림: 상단에 카드로 4.5초간 표시했다가 자동으로 사라짐
    let pushCardSeq = 0;
    function pushNotify(message, { tone = 'warn', icon } = {}) {
      const host = $('pushStack');
      if (!host) return;
      const id = `push-${Date.now()}-${pushCardSeq++}`;
      const resolvedIcon = icon || (tone === 'danger' ? '🚨' : tone === 'success' ? '✅' : '⚠️');
      const card = document.createElement('div');
      card.className = `push-card ${tone === 'danger' ? 'danger' : tone === 'success' ? 'success' : ''}`;
      card.id = id;
      card.innerHTML = `<span class="push-icon">${resolvedIcon}</span><span class="push-text">${message}</span>`;
      host.appendChild(card);
      requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('show')));
      setTimeout(() => {
        card.classList.remove('show');
        setTimeout(() => card.remove(), 320);
      }, 4500);
    }

    function render() {
      const app = $('app');
      const renderer = {
        diagnosisHome: renderDiagnosisHome,
        warmup: renderWarmup,
        ready: renderReady,
        analysis: renderAnalysis,
        result: renderResult,
        timeout: renderTimeout,
        monitorAttach: renderMonitorAttach,
        monitorWait: renderMonitorWait
      }[state.screen] || renderDiagnosisHome;
      const pageHTML = state.onboardingPopupOpen
        ? `<section class="screen onboarding-underlay-blank" aria-hidden="true"></section>${renderOnboardingPopup()}`
        : renderer();
      app.innerHTML = pageHTML;
      updateOverlays();
      renderDemoPanel();
      if (state.sheet === 'settings') renderSettings();
      if (state.sheet === 'help') renderHelp();
      if (state.sheet === 'timeline') renderTimeline();
    }

    function renderSmartDevice({ level = 36, color = '#0A84FF', behavior = 'fixed', compact = false, showButtonLabels = false, activeButton = '', hideHeadLed = false, bottomColor = '', bottomBlink = false, overviewCallouts = false } = {}) {
      const angle = clamp(Number(level) || 0, 0, 100) * 3.6;
      const ringClass = behavior === 'environment' ? 'pulse' : behavior;
      const sequenceDots = behavior === 'sequential'
        ? `<span class="smart-led-sequence">${Array.from({ length: 16 }, (_, i) => `<i style="--i:${i}"></i>`).join('')}</span>`
        : '';
      // hideHeadLed: 예열 중처럼 원형 헤드 LED(분석 링) 자체를 표시하지 않아야 하는 경우 사용합니다.
      const headLedHTML = hideHeadLed ? '' : `<span class="smart-led-ring-base"></span><span class="smart-led-ring ${ringClass}"></span>${sequenceDots}`;

    // 같은 이미지를 두 장 겹쳐서 아래쪽 이미지는 옅게(회색 아웃라인처럼) 보여주고
    // 위쪽 이미지는 진행률만큼 clip-path로 아래에서 위로 드러나게 해 그라데이션처럼 서서히 채워지게 합니다.
