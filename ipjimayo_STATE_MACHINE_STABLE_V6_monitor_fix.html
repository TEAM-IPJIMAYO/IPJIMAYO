    // 결과 화면 상태 분류: 냄새가 높으면(O) 항상 빨강, 냄새/수분이 모두 없는 깨끗한 상태만 파랑, 나머지는 전부 노랑
    function classifyResult(meterValue, moistureExists) {
      const smellTier = meterValue < THRESHOLDS.cleanMax ? 'low' : (meterValue < THRESHOLDS.unclearMax ? 'mid' : 'high');

      if (smellTier === 'high') {
        return moistureExists
          ? { code: 'rewash', color: 'var(--red)', badge: '다시 세탁 필요', title: '다시 세탁해주세요!', message: '충분히 말려도 냄새가 남을 가능성이 높아요.', guidance: '다시 세탁한 뒤 충분히 말려서 착용해주세요. 🧺' }
          : { code: 'basket', color: 'var(--red)', badge: '세탁 후 착용', title: '세탁 후 착용을 추천해요', message: '측정된 냄새 강도가 높아요.', guidance: '세탁하거나 충분히 탈취한 뒤 착용해주세요. 🧼' };
      }

      if (smellTier === 'mid') {
        return moistureExists
          ? { code: 'cautionMoist', color: 'var(--yellow)', badge: '건조 환경 개선', title: '건조 환경을 개선해보세요', message: '냄새와 잔여 수분이 함께 감지되었어요.', guidance: '조금 더 말리고 충분히 환기한 뒤 착용해주세요. 🌬️' }
          : { code: 'caution', color: 'var(--yellow)', badge: '환기 추천', title: '냄새가 일부 감지됐어요', message: '환기 후 착용하거나 탈취제를 사용해 보세요.', guidance: '환기하거나 탈취한 뒤 착용하는 것을 권장해요. 🌿' };
      }

      return moistureExists
        ? { code: 'drying', color: 'var(--yellow)', badge: '조금만 더', title: '조금만 더 말리면 완벽해요!', message: '아직 수분이 조금 남아 있어요.', guidance: '조금 더 말린 뒤 착용해주세요. ☀️' }
        : { code: 'clean', color: 'var(--blue)', badge: '착용 가능', title: '지금 바로 착용해도 좋아요!', message: '냄새와 수분 상태가 모두 좋아요.', guidance: '지금 바로 착용해도 좋아요. 👕' };
    }

    // 결과 화면 상단 진단 문구:
    // 냄새 3단계(감지 안 됨/일부 감지/강하게 감지) ×
    // 수분 4단계(0개/1~2개/3개/4~5개)를 조합합니다.
    function buildDiagnosisSummary(meterValue, filledDrops) {
      const smellTier = meterValue < THRESHOLDS.cleanMax
        ? 'low'
        : (meterValue < THRESHOLDS.unclearMax ? 'mid' : 'high');

      const moistureTier = filledDrops === 0
        ? 'none'
        : (filledDrops <= 2 ? 'little' : (filledDrops === 3 ? 'medium' : 'much'));

      const smellMessages = {
        low: '안 좋은 냄새는 거의 없고',
        mid: '안 좋은 냄새가 일부 감지됐고',
        high: '안 좋은 냄새가 강하게 감지됐고'
      };

      const moistureMessages = {
        none: '잘 말랐어요',
        little: '수분이 조금 남아 있어요',
        medium: '아직 촉촉한 편이에요',
        much: '많이 축축해요'
      };

      return `
        <span class="diagnosis-line">${smellMessages[smellTier]}</span>
        <span class="diagnosis-line">${moistureMessages[moistureTier]}</span>
      `;
    }

    // 상태별 중앙 일러스트/애니메이션
    function resultSceneHTML(code) {
      switch (code) {
        case 'clean':
          // 옷을 크게, 근접 반짝임(빛 스윕 + 스파클)
          return `<div class="scene scene-clean">
            <div class="shirt">👕</div>
            <span class="shine-sweep"></span>
            <span class="sparkle s1">✨</span>
            <span class="sparkle s2">✨</span>
          </div>`;
        case 'drying':
          // 흔들리지 않는 옷 + 방울져 떨어지는 물방울
          return `<div class="scene scene-drying">
            <div class="shirt">👕</div>
            <span class="falling-drop d1">💧</span>
            <span class="falling-drop d2">💧</span>
            <span class="falling-drop d3">💧</span>
          </div>`;
        case 'caution':
          // 올리브색 유기적 냄새 선이 옷 주변에서 피어오르는 모습
          return `<div class="scene scene-caution">
            ${odorWispSetHTML(false)}
            <div class="shirt">👕</div>
          </div>`;
        case 'cautionMoist':
          // 냄새 선 + 물방울이 함께 보이도록 표현
          return `<div class="scene scene-caution">
            ${odorWispSetHTML(false)}
            <div class="shirt">👕</div>
            <span class="falling-drop d2">💧</span>
          </div>`;
        case 'basket':
          // 검은 구름 없이 여러 냄새 선과 퍼프로 강한 냄새를 즉시 인지하도록 표현
          return `<div class="scene scene-basket">
            ${odorWispSetHTML(true)}
            <div class="shirt drop-into">👕</div>
            <div class="basket">🧺</div>
          </div>`;
        case 'rewash':
          // 강한 냄새 선과 잔여 수분이 함께 보이는 재세탁 상태
          return `<div class="scene scene-rewash">
            ${odorWispSetHTML(true)}
            <div class="shirt drop-into">👕
              <span class="stuck-drop sd1">💧</span>
              <span class="stuck-drop sd2">💧</span>
            </div>
            <div class="basket">🧺</div>
          </div>`;
        default:
          return `<div class="scene scene-clean"><div class="shirt">👕</div></div>`;
      }
    }

    // 온도/습도 조합에 따른 건조 tip
    function envTipInfo(temp, humidity) {
      const t = Number(temp);
      const h = Number(humidity);
      const tempLow = Number.isFinite(t) && t < 18;
      const humidityHigh = Number.isFinite(h) && h >= 60;
      if (tempLow && humidityHigh) return { icon: '🥶💦', text: '실내가 건조되기 어려운 환경입니다. 난방과 제습기를 함께 사용하면 건조 시간을 줄일 수 있어요.' };
      if (!tempLow && humidityHigh) return { icon: '💦', text: '습도가 높아 건조가 평소보다 느립니다. 제습기나 환기를 활용해 보세요.' };
      if (tempLow && !humidityHigh) return { icon: '🥶', text: '실내 온도가 낮아 건조 속도가 다소 느릴 수 있습니다. 조금 더 따뜻한 환경에서 건조하면 도움이 됩니다.' };
      return { icon: '🌤️', text: '건조하기 딱 좋은 환경입니다! 지금처럼 유지하면 곧 착용할 수 있어요.' };
    }

    // '건조 환경을 개선해보세요' 결과 화면: 온도만 낮은지, 습도만 높은지, 둘 다인지에 따라
    // 제목과 안내 문구를 다르게 보여줍니다.
    function buildCautionMoistContent(temp, humidity) {
      const t = Number(temp);
      const h = Number(humidity);
      const tempLow = Number.isFinite(t) && t < 18;
      const humidityHigh = Number.isFinite(h) && h > 50;
      if (tempLow && humidityHigh) {
        return { title: '건조 환경을 개선해보세요!', message: '실내를 조금 더 따뜻하게 하고, 제습기를 사용해보세요.' };
      }
      if (tempLow) {
        return { title: '실내 온도를 높여주세요!', message: '건조가 평소보다 느립니다.<br>조금 더 따뜻한 환경에서 건조해보세요.' };
      }
      if (humidityHigh) {
        return { title: '습도를 낮춰주세요!', message: '건조가 평소보다 느립니다.<br>제습기를 활용해보세요.' };
      }
      return { title: '건조 환경을 개선해보세요!', message: '실내를 조금 더 따뜻하게 하고, 제습기를 사용해보세요.' };
    }

    // v93: 현재 건조 환경 카드(왼쪽, 세로 배열)와 권장 건조 환경 카드(오른쪽)를 함께 렌더링합니다.
    // 권장 범위를 벗어나면 수치 옆에 🔺(초과)/🔻(미만, 파란색) 표시를 붙입니다.
    function renderEnvCompareCard(temp, humidity, showTip, tip) {
      const t = Number(temp);
      const h = Number(humidity);
      // 온도: 여름철 최댓값(26℃) 초과 시 ▲(빨강), 겨울철 최솟값(18℃) 미만 시 ▼(파랑)
      // 이모지(🔺🔻)는 색이 고정되어 CSS로 바꿀 수 없어, 색을 지정할 수 있는 텍스트 기호(▲▼)를 사용합니다.
      const tempFlag = Number.isFinite(t) && t > 26
        ? '<span class="env-flag over">▲</span>'
        : (Number.isFinite(t) && t < 18 ? '<span class="env-flag under">▼</span>' : '');
      // 습도: 권장 범위(40~50%) 초과/미만 시 표시
      const humidityFlag = Number.isFinite(h) && h > 50
        ? '<span class="env-flag over">▲</span>'
        : (Number.isFinite(h) && h < 40 ? '<span class="env-flag under">▼</span>' : '');
      return `<div class="env-card env-compare-merged">
        <div class="env-compare-cols">
          <div class="env-compare-col">
            <div class="env-card-title">현재 건조 환경</div>
            <div class="env-item"><span class="env-label">🌡️ 온도</span><div class="env-value">${temp ?? '-'}℃${tempFlag}</div></div>
            <div class="env-item"><span class="env-label">💦 습도</span><div class="env-value">${humidity ?? '-'}%${humidityFlag}</div></div>
          </div>
          <div class="env-compare-divider"></div>
          <div class="env-compare-col">
            <div class="env-card-title recommend">💡 권장 건조 환경</div>
            <div class="env-item"><span class="env-label">🌡️ 온도</span><div class="env-value small">18~22°C(겨울)<br>24~26°C(여름)</div></div>
            <div class="env-item"><span class="env-label">💦 습도</span><div class="env-value small">40-50%</div></div>
          </div>
        </div>
        ${showTip ? `<div class="env-tip"><span class="env-tip-icon">${tip.icon}</span><span class="env-tip-text">${tip.text}</span></div>` : ''}
      </div>`;
    }

    function renderResult() {
      const diagnosis = getAppDiagnosis();
      const hasFirebaseData = diagnosis.hasFirebaseData;
      const smellLevel = diagnosis.smellLevel;
      const moistureLevel = diagnosis.moistureLevel;
      const moistureExists = hasFirebaseData ? moistureLevel > 15 : state.moistureRemaining;
      const meterValue = clamp(hasFirebaseData ? diagnosis.riskScore : smellLevel, 0, 100);
      const temp = hasFirebaseData ? diagnosis.temperature : state.temp;
      const humidity = hasFirebaseData ? diagnosis.humidity : state.humidity;
      const sensorData = state.firebaseLastData?.sensor || state.firebaseLastData?.demo || {};
      const rawMedian = Number(sensorData.rawMedian ?? sensorData.touchMedian);
      const rawSpread = Number(sensorData.rawSpread ?? sensorData.touchSpread);
      const predictedMoisture = Number(
        sensorData.predictedMoisturePercent ?? moistureLevel
      );
      const trainingRows = Number(sensorData.trainingRows);
      const modelName = String(sensorData.model || 'CSV_KNN_9_RAW_STATS');
      const insideTrainingRawRange = sensorData.insideTrainingRawRange !== false;
      const hasSensorPrediction = hasFirebaseData
        && Number.isFinite(rawMedian)
        && Number.isFinite(predictedMoisture);

      const result = classifyResult(meterValue, moistureExists);
      const tip = envTipInfo(temp, humidity);
      // '건조 환경을 개선해보세요' 상황에서는 온도/습도 조건에 맞는 제목과 문구로 교체합니다.
      if (result.code === 'cautionMoist') {
        const c = buildCautionMoistContent(temp, humidity);
        result.title = c.title;
        result.message = c.message;
      }
      const showTip = moistureExists && result.code !== 'rewash' && result.code !== 'cautionMoist'; // 다시 세탁 필요/건조 환경 개선 상황은 팁을 별도로 중복 표시하지 않음

      // 잔여 수분량을 물방울 5개로 표현 (채워진 개수 = 잔여 수분 정도)
      const moistureRaw = hasFirebaseData ? moistureLevel : (moistureExists ? state.moistureValue : 0);
      const filledDrops = moistureExists ? clamp(Math.round((Number(moistureRaw) || 0) / 20), 1, 5) : 0;
      const dropsHTML = Array.from({ length: 5 }, (_, i) =>
        `<span class="drop-icon${i < filledDrops ? ' filled' : ''}">💧</span>`
      ).join('');
      const diagnosisSummary = buildDiagnosisSummary(meterValue, filledDrops);

      return `<section class="screen result-screen" style="--result-color:${result.color}">
        <div class="result-card">
          <button class="result-home-btn" onclick="goHome()" aria-label="홈으로">${iconHome()}</button>
          <h2 class="result-diagnosis-summary">${diagnosisSummary}</h2>

          <div class="result-visual-wrap" aria-label="상태 표시 일러스트">
            <div class="led-ring"></div>
            <div class="result-illustration">${resultSceneHTML(result.code)}</div>
          </div>

          <p class="result-guidance">${result.guidance || `${result.title} ${result.message}`}</p>

          ${renderSmellStageMeter(meterValue)}

          <div class="moisture-drops">
            <div class="drops-title">잔여 수분 상태</div>
            <div class="drop-row">${dropsHTML}</div>
          </div>

          ${renderEnvCompareCard(temp, humidity, showTip, tip)}
        </div>
      </section>`;
    }


    function renderTimeout() {
      return `<section class="screen">
        ${buildHeader({ showToggle:false })}
        <div class="timeout-card">
          <div class="emoji">⏱</div>
          <h1 class="title">측정 대기 시간이<br>종료되었습니다</h1>
          <p class="subtitle">10분 동안 기기 측정이 진행되지 않아 센서를 보호하기 위해 대기 모드로 전환됩니다.</p>
          <button class="primary-btn" style="margin-top:28px" onclick="goHome()">홈으로 가기</button>
        </div>
      </section>`;
    }

    function renderMonitorAttach() {
      return `<section class="screen">
        ${buildHeader()}
        <div class="monitor-hero" aria-label="옷걸이 모듈 장착 애니메이션">
          <div class="hanger"></div>
          <div class="monitor-shirt">👕</div>
          <div class="dock-arrow" aria-hidden="true"></div>
          <div class="monitor-attach-smart">${renderSmartDevice({ level: 34, color: '#30D158', behavior: 'auto', activeButton: 'bottom' })}</div>
        </div>
        <div class="center">
          <h1 class="title">기기를 옷걸이 모듈에<br>장착해주세요!</h1>
          <p class="subtitle">슬라이드 레일에 맞춰 밀어 넣고<br>아래쪽 버튼을 누르면<br>자동 확인이 시작됩니다</p>
        </div>
      </section>`;
    }

    // v55: 메인 화면(monitorWait)은 좌우로 스와이프 가능한 두 개의 패널로 구성됩니다.
    // 1번째 패널: 현재 수분량/건조 예상 시간 등 메인 정보, 2번째 패널: 가장 최근 측정 결과.
    // '정상으로 감소했습니다' 안내 화면과 '수분 정체 → VOC 분석 중' 안내 화면은 완전히 없애고,
    // 계산은 배경에서 조용히 진행한 뒤 결과 패널 내용만 갱신합니다.
    function renderMonitorPanelMain() {
      const moistureValue = clamp(Number(state.moistureValue) || 0, 0, 100);
      // 건조 진행률은 자동확인/데모 여부와 관계없이 '100 - 잔여수분(%)'로 표시합니다.
      const dryingProgress = clamp(100 - moistureValue, 0, 100);
      const estimate = calculateDryingEstimate();
      const remain = remainingMonitorSeconds();
      const remainText = state.monitorNextCheckAt ? formatHMS(remain) : '00:00';
      const dryingSpeed = getDryingSpeedStatus();

      if (state.hardwareMonitoringActive && !state.monitorHasBaseline) {
        return `<div class="monitor-center-card">
          <div class="monitor-clock" aria-label="의류 상태 확인 중">
            <div class="mini-hanger"></div>
            <div class="mini-shirt">👕</div>
            <div class="mini-drop">💧</div>
          </div>
          <h1 class="title">의류 상태를 확인 중입니다.</h1>
          <p class="subtitle" style="font-size:16px">현재 잔여 수분 상태를 측정하고 있어요.</p>
          <p class="monitor-next-check" id="monitorNextCheckText">다음 확인까지 <b>${remainText}</b></p>
        </div>`;
      }

      if (state.monitorDryComplete) {
        return `<div class="monitor-center-card">
          <div class="monitor-clock" aria-label="건조 완료">
            <div class="mini-hanger"></div>
            <div class="mini-shirt">👕</div>
          </div>
          <h1 class="title">건조가 완료되었어요</h1>
          <div class="monitor-drying-stats">
            <div class="monitor-drying-stat moisture">
              <span>건조 진행률</span>
              <b id="monitorMoistureValue">100<small>%</small></b>
            </div>
            <div class="monitor-drying-stat time">
              <span>건조까지 남은 시간</span>
              <b id="monitorDryingEstimate" class="${dryingEstimateTextClass('00:00 (건조 완료)')}">00:00 (건조 완료)</b>
            </div>
          </div>
        </div>`;
      }

      return `<div class="monitor-center-card">
        <div class="monitor-clock ${dryingSpeed.tone === 'caution' ? 'tone-caution' : ''}" id="monitorClockCircle" aria-label="건조 중인 옷이 흔들리며 물방울이 떨어지는 애니메이션">
          <div class="mini-hanger"></div>
          <div class="mini-shirt">👕</div>
          <div class="mini-drop">💧</div>
        </div>
        <h1 class="title" id="monitorStatusTitle">${dryingSpeed.label}</h1>
        <p class="monitor-next-check" id="monitorNextCheckText">다음 확인까지 <b>${remainText}</b></p>
        <div class="monitor-drying-stats">
          <div class="monitor-drying-stat moisture">
            <span>건조 진행률</span>
            <b id="monitorMoistureValue">${Math.round(dryingProgress)}<small>%</small></b>
          </div>
          <div class="monitor-drying-stat time">
            <span>건조까지 남은 시간</span>
            <b id="monitorDryingEstimate" class="${dryingEstimateTextClass(estimate.ready ? estimate.text : '예측 중')}">${estimate.ready ? estimate.text : '예측 중'}</b>
            <em id="monitorEstimateSub" class="monitor-estimate-sub" style="display:${estimate.ready ? 'none' : 'block'}">다음 측정 시 계산</em>
          </div>
        </div>
        <button class="monitor-progress-btn" onclick="openTimeline()">📋 건조 기록 보기</button>
      </div>`;
    }

    function renderMonitorPanelResult() {
      if (!state.monitorHasResult) {
        return `<div class="monitor-result-empty">
          <span class="monitor-result-empty-emoji" aria-hidden="true">🧺</span>
          <h1 class="title" style="font-size:22px">아직 분석 결과가 없어요</h1>
          <p class="subtitle">건조 속도가 느려지면<br>자세히 분석해드릴게요!</p>
        </div>`;
      }

      const meterValue = clamp(Number(state.monitorOdorLevel) || 0, 0, 100);
      const moistureExists = state.moistureValue > 15;
      const temp = state.temp;
      const humidity = state.humidity;

      const result = classifyResult(meterValue, moistureExists);
      const tip = envTipInfo(temp, humidity);
      // '건조 환경을 개선해보세요' 상황은 온도/습도 조건에 맞는 제목과 문구로 교체합니다.
      if (result.code === 'cautionMoist') {
        const c = buildCautionMoistContent(temp, humidity);
        result.title = c.title;
        result.message = c.message;
      }
      const showTip = moistureExists && result.code !== 'rewash' && result.code !== 'cautionMoist';

      const filledDrops = moistureExists ? clamp(Math.round((Number(state.moistureValue) || 0) / 20), 1, 5) : 0;
      const dropsHTML = Array.from({ length: 5 }, (_, i) =>
        `<span class="drop-icon${i < filledDrops ? ' filled' : ''}">💧</span>`
      ).join('');

      const lastAtText = state.monitorLastResultAt ? clockTimeString(state.monitorLastResultAt) : '';

      return `<div class="result-card monitor-result-card" style="--result-color:${result.color}">
        <div class="result-label">MONITORING RESULT</div>
        <h2 style="margin:0;font-size:24px;letter-spacing:-.055em">가장 최근 측정 결과</h2>
        ${lastAtText ? `<p class="result-elapsed-note">${lastAtText} 기준 측정 결과예요.</p>` : ''}

        <div class="result-visual-wrap" aria-label="상태 표시 일러스트">
          <div class="led-ring"></div>
          <div class="result-illustration">${resultSceneHTML(result.code)}</div>
        </div>

        <p class="result-guidance">${result.guidance || `${result.title} ${result.message}`}</p>

        ${renderSmellStageMeter(meterValue)}

        <div class="moisture-drops">
          <div class="drops-title">잔여 수분</div>
          <div class="drop-row">${dropsHTML}</div>
        </div>

        ${renderEnvCompareCard(temp, humidity, showTip, tip)}
      </div>`;
    }

    function renderMonitorWait() {
      if (state.monitorRewashAlert) {
        return `<section class="screen">
          ${buildHeader()}
          <div class="ready-visual">
            <div class="check-big danger">${iconExclaim()}</div>
          </div>
          <div class="center">
            <h1 class="title">재세탁이 필요해요</h1>
            <p class="subtitle">냄새가 기준치를 넘어 자동 확인이 종료되었습니다.</p>
          </div>
          <div class="center" style="margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:12px;">
            <button class="monitor-progress-btn" onclick="openTimeline()">📋 건조 기록 보기</button>
            <button class="primary-btn" style="width:100%" onclick="resetMonitoringToAttach()">홈으로 가기</button>
          </div>
        </section>`;
      }
      return `<section class="screen monitor-swipe-screen">
        ${buildHeader()}
        <div class="monitor-swipe-wrap" id="monitorSwipeWrap" onscroll="onMonitorSwipeScroll(this)">
          <div class="monitor-swipe-track">
            <div class="monitor-swipe-page">${renderMonitorPanelMain()}</div>
            <div class="monitor-swipe-page">${renderMonitorPanelResult()}</div>
          </div>
        </div>
        <div class="monitor-swipe-dots" aria-hidden="true">
          <span class="dot ${state.monitorPanelIndex === 0 ? 'active' : ''}"></span>
          <span class="dot ${state.monitorPanelIndex === 1 ? 'active' : ''}"></span>
        </div>
        ${state.monitorSwipeHintSeen ? '' : `<div class="monitor-swipe-hint" id="monitorSwipeHint" aria-hidden="true"><span class="monitor-swipe-hint-nudge">→</span>오른쪽으로 넘기면 최근 결과를 볼 수 있어요</div>`}
      </section>`;
    }

    // 메인/결과 패널 스와이프 시 페이지 전체를 다시 그리지 않고, 하단 점 표시만 가볍게 갱신합니다.
    function onMonitorSwipeScroll(el) {
      const idx = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
      if (idx === state.monitorPanelIndex) return;
      state.monitorPanelIndex = idx;
      const screenEl = el.closest('.monitor-swipe-screen');
      if (!screenEl) return;
      const dots = screenEl.querySelectorAll('.monitor-swipe-dots .dot');
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      // 한 번이라도 스와이프해서 결과 패널을 봤다면, 이후로는 안내 문구를 다시 보여주지 않습니다.
      if (idx !== 0 && !state.monitorSwipeHintSeen) {
        state.monitorSwipeHintSeen = true;
        const hint = document.getElementById('monitorSwipeHint');
        if (hint) hint.remove();
      }
    }

    function prevOnboarding() {

      if (state.onboardingIndex > 0) state.onboardingIndex -= 1;
      render();
    }

    function nextOnboarding() {
      if (state.onboardingIndex < onboardingSlides.length - 1) {
        state.onboardingIndex += 1;
      } else {
        skipOnboarding();
      }
      render();
    }
    function skipOnboarding() {
      state.onboardingPopupOpen = false;
      state.mode = 'diagnosis';
      state.screen = 'diagnosisHome';
      render();

      render();

    function updateLiveDisplays() {

      if (state.screen === 'diagnosisHome' && isWarmupRunning()) {
        const remain = remainingWarmupSeconds();
        const p = clamp((1 - remain / state.warmupDurationSeconds) * 100, 0, 100);
        const text = document.getElementById('homeWarmupRemain');
        const bar = document.getElementById('homeWarmupProgress');
        if (text) text.textContent = `남은 시간 ${formatHMS(remain)}`;
        if (bar) bar.style.setProperty('--p', `${p}%`);
      }
      if (state.screen === 'warmup') {
        const remain = remainingWarmupSeconds();
        const ratio = clamp(remain / state.warmupDurationSeconds, 0, 1);
        const heat = clamp(1 - ratio, 0, 1);
        const ring = document.getElementById('warmupRing');
        const text = document.getElementById('warmupText');
        if (ring) {
          ring.style.setProperty('--flame-progress', `${Math.round(heat * 100)}%`);
          ring.setAttribute('aria-label', `예열 진행률 ${Math.round(heat * 100)}퍼센트`);
        }
        if (text) text.textContent = formatHMS(remain);
      }
      if (state.screen === 'analysis') {
        const p = diagnosisAnalysisProgressPercent();
        const bar = document.getElementById('analysisProgress');
        if (bar) bar.style.setProperty('--p', `${p}%`);
      }
      if (state.screen === 'monitorWait' && !state.monitorDryComplete) {
        const moisture = document.getElementById('monitorMoistureValue');
        const estimateText = document.getElementById('monitorDryingEstimate');
        const estimateSub = document.getElementById('monitorEstimateSub');
        const nextCheckText = document.getElementById('monitorNextCheckText');
        const clockCircle = document.getElementById('monitorClockCircle');
        const statusTitle = document.getElementById('monitorStatusTitle');
        const estimate = calculateDryingEstimate();
        const remain = remainingMonitorSeconds();
        const remainText = state.monitorNextCheckAt ? formatHMS(remain) : '00:00';
        const dryingProgress = clamp(100 - (Number(state.moistureValue) || 0), 0, 100);
        if (moisture) moisture.innerHTML = `${Math.round(dryingProgress)}<small>%</small>`;
        if (estimateText) {
          const estimateValueText = estimate.ready ? estimate.text : '예측 중';
          estimateText.textContent = estimateValueText;
          estimateText.className = dryingEstimateTextClass(estimateValueText).trim();
        }
        if (estimateSub) estimateSub.style.display = estimate.ready ? 'none' : 'block';
        if (nextCheckText) nextCheckText.innerHTML = `다음 확인까지 <b>${remainText}</b>`;
        const speed = getDryingSpeedStatus();
        if (clockCircle) clockCircle.className = `monitor-clock ${speed.tone === 'caution' ? 'tone-caution' : ''}`;
        if (statusTitle) statusTitle.textContent = speed.label;
      }
    }

    function tick() {
      if (state.scheduledTimestamp && state.warmupType === 'scheduled' && now() >= state.scheduledTimestamp && !isWarmupRunning() && !isReadyActive()) {
        state.scheduledTimestamp = 0;
        localStorage.setItem('scheduledTimestamp', '0');
        startWarmup();
        return;
      }
      if (state.warmupEndTime) {
        if (now() >= state.warmupEndTime) {
          if (state.monitorVocPhase === 'warmup') {
            completeMonitoringWarmup();
            return;
          }
          if (completeWarmup()) return;
        } else {
          updateLiveDisplays();
        }
      }
      if (state.analysisEndTime) {
        if (remainingAnalysisSeconds() <= 0) {
          if (state.analysisContext === 'diagnosis' && state.hardwareMonitoringActive === false) {
            updateLiveDisplays();
          } else if (state.analysisContext === 'monitoring' && state.hardwareMonitoringActive) {
            updateLiveDisplays();
          } else {
            completeAnalysis();
            return;
          }
        } else {
          updateLiveDisplays();
        }
      }
      if (state.warmupType === 'scheduled' && state.idleTimeoutAt && now() >= state.idleTimeoutAt) {
        showIdleTimeout();
        return;
      }
      if (state.screen === 'monitorWait' && state.monitorNextCheckAt) {
        if (state.hardwareMonitoringActive) {
          // 실제 30분 측정 시점은 ESP32가 결정합니다. HTML은 표시만 갱신합니다.
          updateLiveDisplays();
        } else if (remainingMonitorSeconds() <= 0) {
          if (state.firebaseConnected) {
            state.monitorNextCheckAt = 0;
            updateLiveDisplays();
          } else {
            monitorCheck({ stagnation: state.monitorStagnationActive });
          }
        } else {
          updateLiveDisplays();
        }
      }
    }

    function beginFirebaseDiagnosisAnalysis() {
      state.mode = 'diagnosis';
      state.analysisContext = 'diagnosis';
      state.analysisStartTime = now();
      state.analysisEndTime = state.analysisStartTime + state.analysisDurationSeconds * 1000;
      state.warmupEndTime = 0;
      state.readySince = 0;
      state.idleTimeoutAt = 0;
      persistWarmup();
      state.screen = 'analysis';
      render();
    }

    function beginFirebaseMonitoringBaseline() {
      state.mode = 'monitoring';
      state.monitorMounted = true;
      state.monitorHasBaseline = true;
      state.monitorCycleCount = 0;
      state.monitorStagnationActive = false;
      state.monitorOdorDetected = false;
      state.monitorOdorLevel = state.odorLevel;
      state.monitorStagnationStart = 0;
      state.monitorStagnationCycles = 0;
      state.monitorStagnationCheckCount = 0;
      state.monitorOdorHistory = [];
      state.monitorOdorIncreaseCount = 0;
      state.monitorAlertedIncreaseMarks = [];
      state.monitorLastMeasuredOdor = null;
      state.monitorVocStartLogged = false;
      state.monitorEnded = false;
      state.monitorTimeline = [];
      state.monitorAlerts = { firstSent: false, finalSent: false, lastAlertHours: 0, phoneSent: false };
      state.monitorIncreaseStreak = 0;
      state.monitorVocPhase = 'idle';
      state.monitorDryComplete = false;
      state.monitorRewashAlert = false;
      state.monitorHasResult = false;
      state.monitorLastResultAt = 0;
      state.monitorPanelIndex = 0;
      state.monitorSwipeHintSeen = false;
      state.monitorVirtualNowMs = now();
      state.prevMoistureValue = state.moistureValue;
      startDryingEstimator();
      state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;

      state.screen = 'monitorWait';
      logMonitorEvent('건조 시작');
      render();
    }

    function handleFirebaseMonitoringData(data) {
      state.mode = 'monitoring';

      const meta = data?.monitoring || {};
      const eventName = String(meta.event || '');
      const currentMoisture = clamp(Number(state.moistureValue) || 0, 0, 100);
      const packetTime = Number(data?.updatedAt) || now();

      // 실제 BLE 자동 확인에서는 ESP32가 유일한 상태/시간 source of truth입니다.
      // HTML의 과거 랜덤 감소, 자체 예열, 자체 30분 판정은 실행하지 않습니다.
      if (state.hardwareMonitoringActive || eventName) {
        state.hardwareMonitoringActive = true;
        state.monitorMounted = true;
        state.screen = 'monitorWait';
        state.warmupEndTime = 0;
        state.analysisEndTime = 0;

        if (eventName === 'baseline') {
          state.monitorHasBaseline = true;
          state.monitorDryComplete = false;
          state.monitorRewashAlert = false;
          state.monitorEnded = false;
          state.monitorCycleCount = 0;
          state.monitorStagnationActive = false;
          state.monitorVocPhase = 'idle';

          state.prevMoistureValue = currentMoisture;
          state.monitorStartedAt = packetTime;
          state.monitorInitialMoisture = currentMoisture;
          state.monitorMoistureSamples = [{
            at: packetTime,
            value: currentMoisture,
            temp: Number(state.temp),
            humidity: Number(state.humidity)
          }];
          state.monitorDryingEstimateMinutes = null;
          state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;
          state.monitorTimeline = [];
          state.monitorVirtualNowMs = packetTime;
          logMonitorEvent('자동 확인 시작');
          console.log('AUTO_MONITOR|BASELINE', currentMoisture);
          render();
          return;
        }

        if (eventName === 'moisture_decrease') {
          state.monitorHasBaseline = true;
          state.monitorCycleCount = Math.max(Number(state.monitorCycleCount) || 0, Number(meta.cycle) || 0);
          state.monitorStagnationActive = false;
          state.monitorIncreaseStreak = 0;
          state.monitorVocPhase = 'idle';
          state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;
          recordDryingMoistureSample(currentMoisture, packetTime);
          state.prevMoistureValue = currentMoisture;
          state.monitorVirtualNowMs = packetTime;
          logMonitorEvent('수분 감소 확인');
          render();
          return;
        }

        if (eventName === 'stagnation') {
          state.monitorHasBaseline = true;
          state.monitorCycleCount = Math.max(Number(state.monitorCycleCount) || 0, Number(meta.cycle) || 0);
          state.monitorStagnationActive = true;
          // 이번 VOC 결과가 오기 전에는 이전 회차의 '냄새 증가' 표시를 남기지 않습니다.
          state.monitorIncreaseStreak = 0;
          state.monitorNextCheckAt = 0;
          state.monitorVocPhase = 'hardware_wait';
          recordDryingMoistureSample(currentMoisture, packetTime);
          state.prevMoistureValue = currentMoisture;
          state.monitorVirtualNowMs = packetTime;
          logMonitorEvent('수분 정체 감지', 'warn');
          render();
          return;
        }

        if (eventName === 'dry_complete') {
          state.monitorHasBaseline = true;
          state.monitorDryComplete = true;
          state.monitorNextCheckAt = 0;
          state.monitorVocPhase = 'idle';
          recordDryingMoistureSample(currentMoisture, packetTime);
          render();
          return;
        }

        // 자동 확인의 full BME 결과. 값만 갱신하고 다음 M:B/M:E를 기다립니다.
        if (data?.smellAI || data?.sensor) {
          state.monitorHasResult = true;
          state.monitorLastResultAt = packetTime;
          state.monitorOdorLevel = clamp(Number(state.odorLevel) || 0, 0, 100);

          // ESP32가 보내는 누적 odorIncreaseCount가 직전 값보다 늘었을 때만
          // 이번 회차를 '냄새 성분이 증가했습니다.'로 표시합니다.
          const incomingIncreaseCount = Number(meta.odorIncreaseCount);
          if (Number.isFinite(incomingIncreaseCount)) {
            const previousIncreaseCount = Math.max(0, Number(state.monitorOdorIncreaseCount) || 0);
            state.monitorIncreaseStreak = incomingIncreaseCount > previousIncreaseCount ? 1 : 0;
            state.monitorOdorIncreaseCount = Math.max(0, incomingIncreaseCount);
          }

          state.monitorVocPhase = 'idle';
          // 정체/VOC 확인까지 끝났으면 다음 30분 주기를 다시 표시합니다.
          if (!state.monitorDryComplete && !state.monitorEnded) {
            state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;
          }
          render();
          return;
        }

        render();
        return;
      }

      console.warn('Legacy monitoring packet ignored while no hardware monitoring state:', data);
    }

    function handleFirebaseControlData(data) {
      if (!data || typeof data !== 'object') return;

      if (data.mode === 'monitoring') state.mode = 'monitoring';
      else if (data.mode === 'diagnosis') state.mode = 'diagnosis';

      const input = data.input || {};
      const weather = data.weather || {};
      const packetTime = Number(data.updatedAt) || now();

      if (packetTime && packetTime === state.firebaseLastProcessedAt) return;
      state.firebaseLastProcessedAt = packetTime;

      state.firebaseConnected = true;
      state.firebaseLastData = data;
      state.firebaseLastError = '';

      const incomingSmell = finiteOptionalNumber(input.smellStagnation);
      if (incomingSmell !== null) {
        state.odorLevel = clamp(incomingSmell, 0, 100);
        if (state.mode === 'monitoring') state.monitorOdorLevel = state.odorLevel;
      }

      const incomingMoisture = finiteOptionalNumber(input.moistureStagnation);
      if (incomingMoisture !== null) {
        state.moistureValue = clamp(incomingMoisture, 0, 100);
        state.moistureRemaining = state.moistureValue > 0;
      }

      if (data?.sensor?.calibrationValid === false) {
        console.warn(
          '정전용량 센서 raw가 3개 CSV 보정 범위를 크게 벗어났습니다.',
          'rawMedian=', data?.sensor?.rawMedian,
          'trainingRange=', `${data?.sensor?.trainingRawMin ?? 69236}~${data?.sensor?.trainingRawMax ?? 80075}`
        );
      }

      if (data?.smellAI?.valid === false) {

  <script>

    const IPJIMAYO_BLE = {
      serviceUuid: '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
      rxUuid: '6e400002-b5a3-f393-e0a9-e50e24dcca9e',

    const IPJIMAYO_RECONNECT_DELAYS_MS = [1000, 2000, 4000, 8000, 12000];

    let ipjimayoBleDevice = null;
    let ipjimayoBleServer = null;
    let ipjimayoBleRxCharacteristic = null;
    let ipjimayoBleTxCharacteristic = null;

    let ipjimayoBleReconnectTimer = null;

    let ipjimayoBleJsonBuffer = '';

    function updateBleButton(status, label) {

    let bleToastTimer = null;
    function showBleToast(message, type = '') {
      const toast = document.getElementById('bleStatusToast');

      clearTimeout(bleToastTimer);
      toast.className = 'ble-status-toast';

      bleToastTimer = setTimeout(() => toast.classList.remove('show'), 2200);

    function openFirstBlePopup() {
      document.getElementById('bleFirstConnectPopup')?.classList.remove('hidden');

    function closeFirstBlePopup() {

    function setFirstBleButtonLoading(isLoading) {
      const button = document.getElementById('bleFirstConnectButton');

      button.disabled = isLoading;
      button.textContent = isLoading ? '연결 중...' : 'IPJIMAYO 연결하기';
    }

    function setFirstBlePopupMessage(message) {
      const element = document.getElementById('bleFirstConnectMessage');
      if (element) element.textContent = message;
    }

    async function sendBleCommand(command) {
      if (
        !ipjimayoBleDevice ||
        !ipjimayoBleDevice.gatt?.connected ||
        !ipjimayoBleRxCharacteristic
      ) {
        console.warn('BLE 명령 생략 - 연결되지 않음:', command);
        return false;
      }

      try {
        const data = new TextEncoder().encode(command);

        if (typeof ipjimayoBleRxCharacteristic.writeValueWithResponse === 'function') {
          await ipjimayoBleRxCharacteristic.writeValueWithResponse(data);
        } else {
          await ipjimayoBleRxCharacteristic.writeValue(data);
        }

        console.log('ESP32로 BLE 명령 전송:', command);
        return true;
      } catch (error) {
        console.error('BLE 명령 전송 실패:', command, error);
        return false;
      }
    }

    function applyIpjimayoBleResult(resultData) {
      if (!resultData || typeof resultData !== 'object') {
        throw new Error('결과 JSON이 객체 형식이 아닙니다.');
      }

      if (resultData.mode === 'monitoring') {
        state.mode = 'monitoring';
        state.hardwareMonitoringActive =
          resultData.monitoring?.event !== 'dry_complete' &&
          resultData.monitoring?.event !== 'ended';
      } else if (resultData.mode === 'diagnosis') {
        state.mode = 'diagnosis';
      }

      handleFirebaseControlData(resultData);

      console.log(
        'ESP32 BLE 결과 적용:',
        'mode=', resultData.mode,
        'moisture=', resultData?.input?.moistureStagnation,
        'smell=', resultData?.input?.smellStagnation,
        'temp=', resultData?.weather?.temperature,
        'humidity=', resultData?.weather?.humidity,
        resultData
      );
    }

    function handleIpjimayoBleMessage(event) {
      const rawMessage =
        new TextDecoder('utf-8')
          .decode(event.target.value)
          .trim();

      if (!rawMessage) return;

      console.log('ESP32 BLE RX:', rawMessage);

      if (rawMessage === 'PONG') return;

      // -------- 바로 진단 상태 --------
      if (rawMessage === 'D:C') {
        state.hardwareMonitoringActive = false;
        state.mode = 'diagnosis';
        state.analysisStartTime = 0;
        state.analysisEndTime = 0;
        state.warmupEndTime = 0;
        state.readySince = 0;
        state.idleTimeoutAt = 0;
        ipjimayoWarmupReadyReceived = false;
        ipjimayoWarmupStartedAt = 0;
        ipjimayoWarmupAwaitingDeviceStart = false;
        persistWarmup();
        if (state.screen !== 'diagnosisHome' && state.screen !== 'result') {
          state.screen = 'diagnosisHome';
          render();
        }
        return;
      }

      if (rawMessage === 'D:W') {
        state.hardwareMonitoringActive = false;
        state.mode = 'diagnosis';
        state.onboardingPopupOpen = false;
        state.screen = 'warmup';
        state.warmupDurationSeconds = 10;
        ipjimayoWarmupStartedAt = now();
        ipjimayoWarmupReadyReceived = false;
        ipjimayoWarmupAwaitingDeviceStart = false;
        state.warmupEndTime = ipjimayoWarmupStartedAt + 10000;
        state.analysisStartTime = 0;
        state.analysisEndTime = 0;
        state.readySince = 0;
        state.idleTimeoutAt = 0;
        persistWarmup();
        render();
        return;
      }

      if (rawMessage === 'D:R') {
        ipjimayoWarmupReadyReceived = true;
        if (state.mode === 'diagnosis' && state.screen === 'warmup') {
          // ESP32가 바로 이어서 D:M을 보낼 수 있으므로 READY는 짧게 동기화만 합니다.
          state.warmupEndTime = 0;
          state.readySince = now();
          persistWarmup();
          state.screen = 'ready';
          render();
        }
        return;
      }

      if (rawMessage === 'D:M') {
        state.hardwareMonitoringActive = false;
        state.mode = 'diagnosis';
        state.onboardingPopupOpen = false;
        state.analysisContext = 'diagnosis';
        state.analysisDurationSeconds = 26.88;
        state.analysisStartTime = 0;
        state.analysisEndTime = 0;
        state.warmupEndTime = 0;
        state.screen = 'analysis';
        render();
        return;
      }

      if (rawMessage === 'D:G') {
        state.mode = 'diagnosis';
        state.analysisContext = 'diagnosis';
        state.analysisDurationSeconds = 26.88;
        state.analysisStartTime = now();
        state.analysisEndTime = state.analysisStartTime + 26880;
        if (state.screen !== 'analysis') {
          state.screen = 'analysis';
          render();
        } else {
          updateLiveDisplays();
        }
        return;
      }

      if (rawMessage.startsWith('D:P:')) {
        const elapsedMs = Number(rawMessage.slice(4));
        if (Number.isFinite(elapsedMs)) {
          const safeElapsed = clamp(elapsedMs, 0, 26880);
          state.mode = 'diagnosis';
          state.analysisContext = 'diagnosis';
          state.analysisDurationSeconds = 26.88;
          state.analysisStartTime = now() - safeElapsed;
          state.analysisEndTime = state.analysisStartTime + 26880;
          state.screen = 'analysis';
          render();
        }
        return;
      }

      if (rawMessage === 'D:S') {
        state.warmupEndTime = 0;
        state.readySince = now();
        state.idleTimeoutAt = 0;
        persistWarmup();
        return;
      }

      if (rawMessage === 'D:E') {
        showBleToast('센서 초기화 오류를 확인해 주세요.', 'error');
        return;
      }

      // -------- 자동 확인 상태 --------
      if (rawMessage === 'M:S') {
        state.mode = 'monitoring';
        state.hardwareMonitoringActive = true;
        state.onboardingPopupOpen = false;
        state.monitorMounted = true;
        state.monitorHasBaseline = false;
        state.monitorDryComplete = false;
        state.monitorRewashAlert = false;
        state.monitorEnded = false;
        state.monitorVocPhase = 'idle';
        state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;
        state.screen = 'monitorWait';
        render();
        return;
      }

      // 구버전 펌웨어 호환용. 현재 펌웨어는 자동 확인에서 M:W/10초 예열을 사용하지 않습니다.
      if (rawMessage === 'M:W') {
        state.mode = 'monitoring';
        state.hardwareMonitoringActive = true;
        state.onboardingPopupOpen = false;
        state.monitorMounted = true;
        state.monitorHasBaseline = false;
        state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;
        state.screen = 'monitorWait';
        render();
        return;
      }

      if (rawMessage === 'M:B') {
        state.mode = 'monitoring';
        state.hardwareMonitoringActive = true;
        state.screen = 'monitorWait';
        if (!state.monitorDryComplete && !state.monitorEnded) {
          state.monitorNextCheckAt = now() + state.monitorCheckDurationSeconds * 1000;
        }
        state.monitorVocPhase = 'idle';
        render();
        return;
      }

      if (rawMessage === 'M:C') {
        state.mode = 'monitoring';
        state.hardwareMonitoringActive = true;
        state.monitorNextCheckAt = 0;
        state.screen = 'monitorWait';
        console.log('자동 확인 정전용량 수분 측정 중');
        updateLiveDisplays();
        return;
      }

      if (rawMessage === 'M:V') {
        state.mode = 'monitoring';
        state.hardwareMonitoringActive = true;
        state.monitorVocPhase = 'hardware_wait';
        state.monitorNextCheckAt = 0;
        state.warmupEndTime = 0;
        state.analysisEndTime = 0;
        state.screen = 'monitorWait';
        render();
        return;
      }

      if (rawMessage === 'M:D') {
        state.mode = 'monitoring';
        state.hardwareMonitoringActive = false;
        state.monitorMounted = false;
        state.monitorHasBaseline = false;
        state.monitorNextCheckAt = 0;
        state.monitorDryComplete = true;
        state.monitorVocPhase = 'idle';
        render();
        return;
      }

      if (rawMessage === 'M:E') {
        state.mode = 'monitoring';
        state.hardwareMonitoringActive = false;
        state.monitorMounted = false;
        state.monitorHasBaseline = false;
        state.monitorNextCheckAt = 0;
        state.monitorEnded = true;
        state.monitorRewashAlert = true;
        state.monitorVocPhase = 'idle';
        render();
        return;
      }

      if (rawMessage === 'M:X') {
        state.hardwareMonitoringActive = false;
        state.monitorNextCheckAt = 0;
        state.monitorVocPhase = 'idle';
        resetMonitoringToAttach();
        return;
      }

      // -------- 긴 JSON 결과 --------
      if (rawMessage === 'JSON_BEGIN') {
        ipjimayoBleJsonBuffer = '';
        ipjimayoBleJsonReceiving = true;
        return;
      }

      if (rawMessage.startsWith('JSON_CHUNK:')) {
        if (!ipjimayoBleJsonReceiving) {
          ipjimayoBleJsonBuffer = '';
          ipjimayoBleJsonReceiving = true;
        }
        ipjimayoBleJsonBuffer += rawMessage.slice('JSON_CHUNK:'.length);
        return;
      }

      if (rawMessage === 'JSON_END') {
        if (!ipjimayoBleJsonReceiving) return;

        const completedJson = ipjimayoBleJsonBuffer;
        ipjimayoBleJsonBuffer = '';
        ipjimayoBleJsonReceiving = false;

        try {
          applyIpjimayoBleResult(JSON.parse(completedJson));
        } catch (error) {
          console.error('ESP32 결과 JSON 해석 실패:', error, completedJson);
          showBleToast('측정 결과를 해석하지 못했습니다.', 'error');
        }
        return;
      }

      if (rawMessage.startsWith('{') && rawMessage.endsWith('}')) {
        try {
          applyIpjimayoBleResult(JSON.parse(rawMessage));
        } catch (error) {
          console.error('ESP32 단일 JSON 해석 실패:', error);
        }
      }
    }

    function handleBleDisconnected() {
      state.firebaseConnected = false;

      ipjimayoBleServer = null;
      ipjimayoBleRxCharacteristic = null;
      ipjimayoBleTxCharacteristic = null;
      ipjimayoBleJsonBuffer = '';
      ipjimayoBleJsonReceiving = false;

      if (ipjimayoBleIntentionalDisconnect) return;

      console.warn('IPJIMAYO BLE 연결 해제');
      showBleToast('BLE 연결 복구 중...');
      scheduleIpjimayoReconnect();
    }

    function scheduleIpjimayoReconnect() {
      if (
        ipjimayoBleIntentionalDisconnect ||
        !ipjimayoBleDevice ||
        ipjimayoBleDevice.gatt?.connected ||
        ipjimayoBleReconnectTimer
      ) {
        return;
      }

      if (ipjimayoBleReconnectAttempt >= IPJIMAYO_RECONNECT_DELAYS_MS.length) {
        openFirstBlePopup();
        setFirstBlePopupMessage('자동 재연결에 실패했습니다. 버튼을 눌러 다시 연결해 주세요.');
        setFirstBleButtonLoading(false);
        showBleToast('BLE 재연결이 필요합니다.', 'error');
        return;
      }

      const delayMs =
        IPJIMAYO_RECONNECT_DELAYS_MS[ipjimayoBleReconnectAttempt++];

      ipjimayoBleReconnectTimer = setTimeout(async () => {
        ipjimayoBleReconnectTimer = null;
        try {
          await finishIpjimayoBleConnection(ipjimayoBleDevice);
        } catch (error) {
          console.warn('BLE 재접속 실패:', error);
          scheduleIpjimayoReconnect();
        }
      }, delayMs);
    }

    async function finishIpjimayoBleConnection(device) {
      if (ipjimayoBleConnectionPromise) {
        return ipjimayoBleConnectionPromise;
      }

      ipjimayoBleConnectionPromise = (async () => {
        ipjimayoBleDevice = device;
        ipjimayoBleIntentionalDisconnect = false;

        device.removeEventListener('gattserverdisconnected', handleBleDisconnected);
        device.addEventListener('gattserverdisconnected', handleBleDisconnected);

        if (!device.gatt.connected) {
          ipjimayoBleServer = await device.gatt.connect();
        } else {
          ipjimayoBleServer = device.gatt;
        }

        // reconnect 뒤에는 기존 service/characteristic 객체를 재사용하지 않습니다.
        const service =
          await ipjimayoBleServer.getPrimaryService(IPJIMAYO_BLE.serviceUuid);

        ipjimayoBleRxCharacteristic =
          await service.getCharacteristic(IPJIMAYO_BLE.rxUuid);

        ipjimayoBleTxCharacteristic =
          await service.getCharacteristic(IPJIMAYO_BLE.txUuid);

        await ipjimayoBleTxCharacteristic.startNotifications();

        ipjimayoBleTxCharacteristic.removeEventListener(
          'characteristicvaluechanged',
          handleIpjimayoBleMessage
        );
        ipjimayoBleTxCharacteristic.addEventListener(
          'characteristicvaluechanged',
          handleIpjimayoBleMessage
        );

        state.firebaseConnected = true;
        ipjimayoBleReconnectAttempt = 0;
        clearTimeout(ipjimayoBleReconnectTimer);
        ipjimayoBleReconnectTimer = null;

        closeFirstBlePopup();
        setFirstBleButtonLoading(false);
        updateBleButton('connected');

        // 앱을 열었다는 이유로 ESP32 상태를 강제로 cold reset하지 않습니다.
        // PING snapshot을 받아 기기 실제 상태를 UI가 따라갑니다.
        await sendBleCommand('PING');
        await sendBleCommand('GET_LAST_RESULT');

        console.log('IPJIMAYO BLE 연결 성공:', device.name);
      })();

      try {
        await ipjimayoBleConnectionPromise;
      } finally {
        ipjimayoBleConnectionPromise = null;
      }
    }

    async function connectIpjimayoBle() {
      if (!navigator.bluetooth) {
        alert(
          '이 브라우저에서는 Web Bluetooth를 사용할 수 없습니다.\n' +
          'Chrome/Edge와 HTTPS 또는 localhost 환경에서 실행해 주세요.'
        );
        return;
      }

      try {
        openFirstBlePopup();
        setFirstBleButtonLoading(true);
        setFirstBlePopupMessage('IPJIMAYO 기기를 찾고 있습니다.');

        const selectedDevice =
          await navigator.bluetooth.requestDevice({
            filters: [{ name: 'IPJIMAYO' }],
            optionalServices: [IPJIMAYO_BLE.serviceUuid]
          });

        await finishIpjimayoBleConnection(selectedDevice);
      } catch (error) {
        console.error('BLE 연결 실패:', error);
        setFirstBleButtonLoading(false);
        setFirstBlePopupMessage('연결에 실패했습니다. 기기 전원을 확인한 뒤 다시 시도해 주세요.');
        showBleToast('IPJIMAYO 연결 실패', 'error');
      }
    }

    async function autoConnectIpjimayoBle() {
      if (!navigator.bluetooth) {
        openFirstBlePopup();
        setFirstBlePopupMessage('이 브라우저는 Web Bluetooth를 지원하지 않습니다.');
        return;
      }

      if (typeof navigator.bluetooth.getDevices !== 'function') {
        openFirstBlePopup();
        setFirstBlePopupMessage('IPJIMAYO 연결하기 버튼을 눌러 주세요.');
        return;
      }

      try {
        const permittedDevices = await navigator.bluetooth.getDevices();
        const saved =
          permittedDevices.find(device => device.name === 'IPJIMAYO');

        if (!saved) {
          openFirstBlePopup();
          setFirstBlePopupMessage('처음 한 번만 연결하면 다음부터는 자동으로 연결됩니다.');
          return;
        }

        setFirstBlePopupMessage('IPJIMAYO 기기에 자동 연결 중입니다.');
        setFirstBleButtonLoading(true);
        await finishIpjimayoBleConnection(saved);
      } catch (error) {
        console.warn('BLE 자동 연결 실패:', error);
        openFirstBlePopup();
        setFirstBlePopupMessage('자동 연결에 실패했습니다. 버튼을 눌러 다시 연결해 주세요.');
        setFirstBleButtonLoading(false);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document
        .getElementById('bleFirstConnectButton')
        ?.addEventListener('click', connectIpjimayoBle);

      openFirstBlePopup();
      autoConnectIpjimayoBle();
    });
  </script>


  
  <!-- Firebase listener removed: ESP32 BLE is the only runtime source. -->
